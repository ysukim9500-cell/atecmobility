  ATEC 운행일지 — 이 파일의 원본은 ACTs-ATECmobility/web/driving-v2.html 이다.
  여기서 직접 고치지 말고 그쪽을 고친 뒤 복사할 것. 두 곳이 갈라지면 찾기 어렵다.
  같이 올라가야 하는 것: driving-app.js · xlsx.js · hipass.js
                        vendor/ (pdf.js 4.10.38 .mjs — 증빙 PDF 를 이미지로 바꾼다)
                        brand/atec-driving.png · brand/atec-lockup.png · brand/atec-mark.png
-->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>ATEC 운행일지</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@latest/css/SpoqaHanSansNeo.css">
<style>
/* ════════════════════════════════════════════════════════════════════════
   ATEC 운행일지 — 디자인 시스템
   [가이드라인] ATEC mobility Corporate Identity Design Guidelines (2025-12) 준거

   CI 실측값
     레드   C10 M100 Y50 K0  = R215 G0  B81   = #D70051
     그레이 C67 M52  Y44 K18  = R90  G102 B111 = #5A666F
     서체   Spoqa Han Sans Neo (Light 300 / Regular 400 / Medium 500 / Bold 700)
            ★ 600 굵기가 없다. 600 을 쓰면 브라우저가 가짜 볼드를 만든다. 쓰지 말 것.

   설계 규칙
     1. 회색은 임의로 고르지 않는다. CI 그레이의 색상각(206°)을 유지한 채
        명도만 내린 한 계열로 쓴다 — 그래야 화면 전체가 브랜드 안에 있다.
     2. 레드는 '여기를 보라'일 때만. 강조·경고·현재위치·주요행동.
     3. 상자를 겹치지 않는다. 면과 여백으로 나누고 선은 머리카락 굵기로.
     4. 숫자가 주인공. 전부 tabular-nums · 우측정렬 · 라벨보다 크고 진하게.
     5. 첫 화면은 숫자 나열이 아니라 '한 문장의 판정'으로 연다.
   ════════════════════════════════════════════════════════════════════════ */

:root{
  /* ── CI 원색 ── */
  --red:#D70051;      /* PANTONE 기준색 */
  --red-700:#A3003D;  /* 눌림·호버 */
  --red-100:#F8D3E1;
  --red-50:#FCEEF3;

  /* ── CI 그레이(#5A666F, hue 206°)에서 파생한 한 계열 ── */
  --ink-900:#1D252B;  /* 제목 */
  --ink-800:#2F3941;
  --ink-700:#434E56;  /* 본문 */
  --ink-600:#5B6871;  /* = CI 그레이 */
  --ink-500:#788691;  /* 보조 */
  --ink-400:#A0AAB1;  /* 흐림 */
  --ink-300:#C7CDD1;
  --ink-200:#E2E6E9;  /* 선 */
  --ink-100:#F0F3F4;  /* 옅은 선 */
  --ink-50:#F8F9FA;   /* 바탕 */

  --canvas:#F6F7F8;
  --surface:#FFFFFF;
  --sunken:#FAFBFC;

  --ok:#0C7A57; --ok-50:#EAF6F1;
  --warn:#96620A; --warn-50:#FCF5E9;

  --rail:248px; --head:58px;
  --r-xs:6px; --r-sm:8px; --r:12px; --r-lg:16px;
  /* driving-app.js 가 쓰는 별칭. 정의가 없으면 색은 부모색, 선은 currentColor(진한 선)가 된다. */
  --ink-2:var(--ink-800); --ink-3:var(--ink-500); --line:var(--ink-200);
  --pop:0 1px 2px rgba(29,37,43,.05), 0 16px 40px -12px rgba(29,37,43,.22);
  --ease:cubic-bezier(.2,.6,.35,1);
  --t:.13s var(--ease);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Spoqa Han Sans Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,
    "Segoe UI","Malgun Gothic",sans-serif;
  background:var(--canvas);color:var(--ink-700);
  font-size:13.5px;font-weight:400;line-height:1.62;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:3px}
[hidden]{display:none !important}
svg{display:block;flex:none}
img{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* 관리자 전용 — display:revert 는 <a> 를 inline 으로 되돌려 메뉴를 깨뜨린다. */
.adm{display:none}
/* 권한 관리는 관리자 중에서도 마스터 계정만 본다(서버 RPC 가 그렇게 못 박혀 있다). */
/* 통행료 채우기 — 정한 묶음은 옅게 해 남은 것이 눈에 띄게 한다 */
tbody tr.tfdone{background:var(--sunken)}
tbody tr.tfdone .lead{color:var(--ink-500)}
.mst{display:none !important}
body.is-master a.mst{display:flex !important}
body.is-admin a.adm{display:flex}
body.is-admin .navsec.adm{display:block}

/* ── 로고 ────────────────────────────────────────────────────────────
   CI 원본 아트워크를 그대로 쓴다. 글꼴로 흉내 내지 않는다.
   가로 비율은 원본 그대로 두고 높이만 지정한다.

   atec-driving.png 은 원본이 아니다. ATEC 로고타입은 시중 글꼴이 아니라
   (후보 20종을 굵기·자간 바꿔가며 픽셀로 겹쳐 최고 69.9%, 전부 같은 대문자
   높이에서 20% 좁았다) 장체로 따로 그린 아트워크다. 그래서 글꼴을 갖다
   쓰지 않고, 원본에서 잰 수치(대문자 255 · 세로획 60 · 가로획 41 ·
   둥근 글자 오버슈트 ±9 · 자간 32)로 DRIVING 을 같은 규칙으로 그렸다.
   ATEC 부분은 원본 그대로 합성했고, DRIVING 은 CI 그레이다 — 가로형
   로고가 'ATEC(레드) + 에이텍모빌리티(그레이)' 인 것과 같은 짜임이다.
   ★ 공식 아트워크가 나오면 이 파일 하나만 갈아 끼우면 된다.
   만든 스크립트: brand/make-driving-logo.mjs (brand/measure-logo.mjs 로 원본을 잰다)                          */
.logo-mark{height:14px;width:auto}          /* ATEC DRIVING (3177:273) */
.logo-mark.tiny{display:none}               /* 아주 좁은 화면용 ATEC 단독 */
.logo-lockup{height:26px;width:auto}        /* ATEC mobility 가로형 (3481:315) */
.appname{display:inline-flex;align-items:center;white-space:nowrap;border:0;background:none;padding:0;cursor:pointer}
.appname:focus-visible{outline:2px solid var(--red);outline-offset:4px;border-radius:2px}

/* ═════════════════ 로그인 ═════════════════ */
#login{min-height:100dvh;display:grid;place-items:center;padding:32px 22px}
.lwrap{width:100%;max-width:348px}
.lwrap .logo-lockup{height:24px;margin-bottom:26px}
.ltitle{font-size:21px;font-weight:700;color:var(--ink-900);letter-spacing:-.035em;margin:0}
.ltag{margin:7px 0 28px;font-size:13.5px;color:var(--ink-500);line-height:1.7}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11.5px;font-weight:500;color:var(--ink-600);
  margin-bottom:6px;letter-spacing:.01em}
.fld input{width:100%;font-size:15px;padding:12px 14px;border:1px solid var(--ink-200);
  border-radius:var(--r-sm);background:var(--surface);color:var(--ink-900);
  transition:border-color var(--t),box-shadow var(--t)}
.fld input::placeholder{color:var(--ink-400)}
.fld input:focus{outline:none;border-color:var(--ink-500);box-shadow:0 0 0 4px var(--ink-100)}
#loginBtn{width:100%;font-size:14.5px;font-weight:500;cursor:pointer;border:0;background:var(--red);
  color:#fff;padding:13px;border-radius:var(--r-sm);margin-top:12px;transition:background var(--t)}
#loginBtn:hover{background:var(--red-700)}
#loginBtn:disabled{background:var(--ink-300);cursor:progress}
.lmsg{margin-top:13px;font-size:12.5px;color:var(--red-700);background:var(--red-50);
  border-radius:var(--r-xs);padding:10px 12px;display:flex;gap:8px;align-items:flex-start;line-height:1.55}
.lnote{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink-200);
  font-size:12.5px;color:var(--ink-500);line-height:1.85}
.lnote b{color:var(--ink-700);font-weight:500}

/* ═════════════════ 뼈대 ═════════════════ */
#app{display:none}
header.top{
  position:sticky;top:0;z-index:50;height:var(--head);background:rgba(255,255,255,.9);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--ink-200);display:flex;align-items:center;gap:14px;padding:0 20px}
.sp{flex:1}

/* 마감주기 = 전 화면을 지배하는 값이라 머리띠에 고정한다 */
.cycle{position:relative;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;
  border:1px solid var(--ink-200);border-radius:999px;background:var(--surface);cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--ink-900);transition:border-color var(--t),background var(--t)}
.cycle:hover{border-color:var(--ink-400);background:var(--sunken)}
.cycle svg{color:var(--ink-400)}
.cycle select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;border:0}
/* 포커스 표시는 투명한 select 가 아니라 겉껍데기에 그린다 — 안 그러면 키보드로
   Tab 했을 때 지금 어디에 있는지 전혀 안 보인다. */
.cycle select:focus-visible{outline:0}
.cycle:focus-within{outline:2px solid var(--red);outline-offset:2px}
/* 표에서 눌러서 여는 행 — 키보드로 갔을 때 어디인지 보이게 한다. */
tbody tr.clk:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.cycle .tag{font-weight:400;color:var(--ink-500)}

.uchip{display:flex;align-items:center;gap:9px;padding:3px 8px 3px 3px;border-radius:999px;
  cursor:pointer;border:0;background:none;transition:background var(--t)}
.uchip:hover{background:var(--ink-100)}
.uav{width:29px;height:29px;border-radius:50%;background:var(--ink-600);color:#fff;font-size:11.5px;
  font-weight:500;display:grid;place-items:center;letter-spacing:-.02em;flex:none}
.uav.is-admin-av{background:var(--red)}
.utxt{text-align:left;line-height:1.3;min-width:0}
.utxt b{display:block;font-size:12.5px;font-weight:500;color:var(--ink-900)}
.utxt span{display:block;font-size:11px;color:var(--ink-400);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:150px}

.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--ink-200);
  border-radius:var(--r-xs);background:var(--surface);cursor:pointer;color:var(--ink-600);transition:var(--t)}
.iconbtn:hover{border-color:var(--ink-400);background:var(--sunken);color:var(--ink-800)}
#burger{display:none}

.shell{display:flex;align-items:flex-start}

/* ── 좌측 레일 ───────────────────────────────────────────────────── */
aside{width:var(--rail);flex:0 0 var(--rail);position:sticky;top:var(--head);
  height:calc(100dvh - var(--head));overflow-y:auto;overscroll-behavior:contain;
  padding:18px 12px 36px;border-right:1px solid var(--ink-200);background:var(--surface)}
.navsec{padding:18px 10px 7px;font-size:10.5px;font-weight:700;color:var(--ink-400);letter-spacing:.11em}
.navsec:first-child{padding-top:2px}
aside a{display:flex;align-items:center;gap:11px;height:37px;padding:0 10px;border-radius:var(--r-xs);
  font-size:13px;font-weight:400;color:var(--ink-700);cursor:pointer;text-decoration:none;
  position:relative;transition:background var(--t),color var(--t)}
aside a svg{color:var(--ink-400);transition:color var(--t)}
aside a:hover{background:var(--ink-100);color:var(--ink-900)}
aside a:hover svg{color:var(--ink-600)}
aside a.on{background:var(--red-50);color:var(--red-700);font-weight:500}
aside a.on svg{color:var(--red)}
aside a.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;
  background:var(--red);border-radius:0 3px 3px 0}
.pill{margin-left:auto;font-size:11px;font-weight:500;min-width:20px;height:20px;padding:0 6px;
  border-radius:999px;display:grid;place-items:center;background:var(--ink-100);color:var(--ink-500)}
.pill.hot{background:var(--red);color:#fff;font-weight:700}
aside a.on .pill{background:#fff;color:var(--red-700)}
aside a.on .pill.hot{background:var(--red);color:#fff}

main{flex:1;min-width:0;padding:28px 30px 88px}
.inner{max-width:1280px;margin:0 auto}

/* ── 페이지 머리 ─────────────────────────────────────────────────── */
.phead{margin-bottom:24px}
.phead h1{margin:0;font-size:24px;font-weight:700;color:var(--ink-900);
  letter-spacing:-.035em;line-height:1.24}
.phead p{margin:6px 0 0;font-size:13px;color:var(--ink-500)}

/* ── 히어로: 한 문장의 판정 ──────────────────────────────────────── */
.hero{background:var(--surface);border:1px solid var(--ink-200);border-radius:var(--r-lg);
  padding:28px 30px;margin-bottom:18px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.11em;color:var(--ink-400);
  display:flex;align-items:center;gap:8px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}
.eyebrow .dot.ok{background:var(--ok)}
.verdict{margin:14px 0 0;font-size:28px;font-weight:700;color:var(--ink-900);
  letter-spacing:-.04em;line-height:1.3}
.verdict em{font-style:normal;color:var(--red)}
.verdict.clean em{color:var(--ok)}
.track{margin-top:22px;height:5px;border-radius:99px;background:var(--ink-100);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--red);
  transition:width .8s var(--ease)}
.track.done i{background:var(--ink-400)}
.facts{display:flex;flex-wrap:wrap;gap:0 38px;margin-top:22px}
.fact{padding-top:2px}
.fact .k{font-size:11.5px;color:var(--ink-400);font-weight:400}
.fact .v{font-size:21px;font-weight:700;color:var(--ink-900);letter-spacing:-.035em;line-height:1.38}
.fact .v small{font-size:12.5px;font-weight:500;color:var(--ink-400);margin-left:2px;letter-spacing:0}
.fact .v.alert{color:var(--red)}
.fact .sub{font-size:11.5px;color:var(--ink-400)}

/* ── 구역 ───────────────────────────────────────────────────────── */
.sect{margin-top:28px}
.sect > .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding:0 2px}
.sect > .hd h2{margin:0;font-size:14px;font-weight:700;color:var(--ink-900);letter-spacing:-.02em}
.sect > .hd .cnt{font-size:12px;color:var(--ink-400)}
.sect > .hd .sp{flex:1}
.panel{background:var(--surface);border:1px solid var(--ink-200);border-radius:var(--r);overflow:hidden}

/* ── 점검 항목 ───────────────────────────────────────────────────── */
.issue{display:flex;align-items:center;gap:15px;padding:16px 20px;width:100%;text-align:left;
  border:0;border-bottom:1px solid var(--ink-100);background:none;cursor:pointer;
  transition:background var(--t)}
.issue:last-child{border-bottom:0}
.issue:hover{background:var(--sunken)}
.issue[disabled]{cursor:default}
.issue[disabled]:hover{background:none}
.issue .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.issue.sv-bad .ico{background:var(--red-50);color:var(--red)}
.issue.sv-warn .ico{background:var(--warn-50);color:var(--warn)}
.issue.sv-ok  .ico{background:var(--ok-50);color:var(--ok)}
.issue .bd{flex:1;min-width:0}
.issue .t{font-size:13.5px;font-weight:500;color:var(--ink-900);display:block}
.issue .d{font-size:12.5px;color:var(--ink-500);margin-top:2px;line-height:1.58;display:block}
.issue .amt{font-size:20px;font-weight:700;letter-spacing:-.03em;color:var(--ink-400)}
.issue.sv-bad .amt{color:var(--red)}
.issue.sv-warn .amt{color:var(--warn)}
.issue.sv-ok .amt{color:var(--ok)}
.issue .go{color:var(--ink-300);transition:transform .16s var(--ease),color var(--t)}
.issue:hover .go{transform:translateX(3px);color:var(--ink-500)}

/* ── 표 ─────────────────────────────────────────────────────────── */
/* ★ overflow 를 가진 요소가 sticky 의 기준이 된다. top 은 반드시 0.
   행이 많은 표만 .tall 로 자기 스크롤을 갖는다(런타임에 붙인다). */
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
.scroll table{min-width:660px}
.scroll.tall{max-height:min(64dvh,680px)}
/* ★ 아래는 **화면 전용** 표 규칙이다. @media screen 으로 감싸지 않으면
   nowrap·회색 글자·sticky 머리글·마지막 행 테두리 제거가 인쇄에도 그대로 적용돼
   주소가 옆 칸을 덮고, 글자가 연회색으로 찍히고, 결재 상자 아래가 뚫린다.
   (2026-09-15 실측: 한 장에 32칸 침범) #printArea 는 화면에서 감춰져 있어 부작용이 없다. */
@media screen{
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:var(--surface);
  text-align:left;font-weight:500;font-size:11px;color:var(--ink-400);letter-spacing:.05em;
  padding:12px 15px;border-bottom:1px solid var(--ink-200);white-space:nowrap}
th.n,td.n{text-align:right}
tbody td{padding:11px 15px;border-bottom:1px solid var(--ink-100);white-space:nowrap;
  color:var(--ink-700);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover td{background:var(--sunken)}
td .lead,td.lead{font-weight:500;color:var(--ink-900)}
td.n{font-variant-numeric:tabular-nums}
td.total{font-weight:700;color:var(--ink-900)}
td.el{max-width:240px;overflow:hidden;text-overflow:ellipsis;color:var(--ink-500)}
td.dim{color:var(--ink-400)}
.dim{color:var(--ink-400)}
td.unk{color:var(--red);font-weight:500}   /* 미확정 건수 — Spoqa 는 600 이 없어 500 을 쓴다 */
/* 문제가 있는 행은 왼쪽 가는 줄로. 칸을 색칠하면 숫자가 안 읽힌다. */
tbody tr.flagged td:first-child{box-shadow:inset 3px 0 0 var(--red)}
}

/* ── 상태 ───────────────────────────────────────────────────────── */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:400;white-space:nowrap}
.st::before{content:"";width:5px;height:5px;border-radius:50%;flex:none;background:var(--ink-300)}
.st.ok{color:var(--ok)} .st.ok::before{background:var(--ok)}
.st.warn{color:var(--warn)} .st.warn::before{background:var(--warn)}
.st.bad{color:var(--red);font-weight:500} .st.bad::before{background:var(--red)}
.st.dim{color:var(--ink-400)}
.kind{display:inline-block;font-size:11.5px;font-weight:400;color:var(--ink-500);
  border:1px solid var(--ink-200);border-radius:5px;padding:0 6px;line-height:19px}
.kind.biz{color:var(--ink-900);border-color:var(--ink-400);font-weight:500}

/* ── 필터 ───────────────────────────────────────────────────────── */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--ink-100);border-radius:var(--r-sm);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;cursor:pointer;font-size:12.5px;font-weight:400;color:var(--ink-500);
  padding:6px 12px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;transition:var(--t)}
.seg button:hover{color:var(--ink-900)}
.seg button.on{background:var(--surface);color:var(--ink-900);font-weight:500;
  box-shadow:0 1px 2px rgba(29,37,43,.08)}
.seg button .c{font-size:11px;font-weight:500;color:var(--ink-400)}
.seg button.on .c{color:var(--red)}
.seg button.on.warnish .c{color:var(--warn)}

.field{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:var(--surface);
  border:1px solid var(--ink-200);border-radius:var(--r-xs);color:var(--ink-400);transition:border-color var(--t)}
.field:focus-within{border-color:var(--ink-500)}
.field select,.field input{border:0;background:none;outline:none;font-size:12.5px;color:var(--ink-900);
  font-weight:400;min-width:0}
.field input{width:152px}
.field input::placeholder{color:var(--ink-400)}

.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r-xs);
  border:1px solid var(--ink-200);background:var(--surface);color:var(--ink-700);font-size:12.5px;
  font-weight:500;cursor:pointer;transition:var(--t)}
.btn:hover{border-color:var(--ink-400);background:var(--sunken);color:var(--ink-900)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-700);border-color:var(--red-700)}
.btn.sm{height:29px;padding:0 11px;font-size:11.5px}

/* ── 빈 상태 / 로딩 ─────────────────────────────────────────────── */
.blank{padding:64px 24px;text-align:center}
.blank .ico{width:46px;height:46px;margin:0 auto 15px;border-radius:13px;background:var(--ink-100);
  display:grid;place-items:center;color:var(--ink-400)}
.blank .t{font-size:14px;font-weight:500;color:var(--ink-700)}
.blank .d{font-size:12.5px;color:var(--ink-400);margin-top:5px}
.sk{background:var(--ink-100);border-radius:5px;height:12px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
  animation:shimmer 1.35s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.fade{animation:fade .24s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ── 슬라이드 패널 ──────────────────────────────────────────────── */
#panel{position:fixed;inset:0;z-index:70;display:none}
#panel.open{display:block}
/* 가림막이 좌측 레일까지 덮어, 패널이 열린 채 메뉴를 누르면 첫 클릭은 패널만
   닫히고 화면은 안 바뀌었다(두 번 눌러야 이동). 레일(248px)을 비켜 둔다. */
#panel .veil{position:absolute;inset:0 0 0 var(--rail);background:rgba(29,37,43,.36);animation:fade .2s}
@media (max-width:900px){ #panel .veil{inset:0} }
#panel .sheet{position:absolute;top:0;right:0;bottom:0;width:min(468px,100%);background:var(--surface);
  box-shadow:var(--pop);display:flex;flex-direction:column;animation:slide .28s var(--ease)}
@keyframes slide{from{transform:translateX(26px);opacity:.55}to{transform:none;opacity:1}}
#panel .ph{padding:17px 20px;border-bottom:1px solid var(--ink-200);display:flex;align-items:center;gap:12px}
#panel .ph .t{font-size:15px;font-weight:700;color:var(--ink-900);letter-spacing:-.02em}
#panel .ph .s{font-size:12px;color:var(--ink-400);margin-top:1px}
#panel .pb{flex:1;overflow-y:auto;padding:6px 20px 20px}
#panel .pf{padding:14px 20px;border-top:1px solid var(--ink-200);display:flex;gap:9px;align-items:center}
.kv{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--ink-100);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{flex:0 0 86px;color:var(--ink-400);font-size:12.5px}
.kv .v{flex:1;min-width:0;color:var(--ink-700);word-break:break-word}
.kv .v b{color:var(--ink-900);font-weight:500}
.kv .v .dim{color:var(--ink-400)}
table.kv{width:100%;border-collapse:collapse}
table.kv th{text-align:left;font-weight:400;color:var(--ink-400);width:96px;padding:9px 16px;font-size:12.5px}
table.kv td{padding:9px 16px 9px 0;font-size:13.5px;color:var(--ink-900)}
table.kv tr+tr th,table.kv tr+tr td{border-top:1px solid var(--ink-100)}

/* ── 결재 ───────────────────────────────────────────────────────────
   결재는 '어디까지 갔나'가 전부다. 그래서 진행 막대를 크게 쓰고
   나머지는 최대한 조용히 둔다. 승인·반려 버튼만 눈에 띄면 된다.       */
.astrip{background:var(--surface);border:1px solid var(--ink-200);border-radius:var(--r);
  padding:16px 20px 18px}
.acard{border-bottom:1px solid var(--ink-100);padding:16px 20px 18px}
.acard:last-child{border-bottom:0}
.ahd{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:4px}
.ahd b{font-size:14px;font-weight:700;color:var(--ink-900);letter-spacing:-.02em}
.acyc{font-size:12px;color:var(--ink-500)}
.asum{font-size:12px;color:var(--ink-400);font-variant-numeric:tabular-nums}

/* 진행 막대 */
.aprog{display:flex;align-items:center;flex-wrap:wrap;gap:0 2px;margin-top:12px}
.anode{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-size:10.5px;font-weight:500}
.anode.done{background:var(--ok);color:#fff}
.anode.now{background:var(--red);color:#fff}
.anode.bad{background:var(--red-700);color:#fff;font-weight:700}
.anode.wait{background:var(--ink-100);color:var(--ink-400)}
.alabel{font-size:12px;color:var(--ink-700);margin:0 12px 0 7px;white-space:nowrap}
.alabel.wait{color:var(--ink-400)}
.alabel em{font-style:normal;color:var(--ink-400);font-size:11px;margin-left:5px}
.aline{width:22px;height:2px;background:var(--ink-200);flex:none}
.aline.done{background:var(--ok)}
.aact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* 상신 창 */
.aline-list{border-top:1px solid var(--ink-100);margin-top:4px}
.arow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ink-100)}
.aseq{width:24px;height:24px;border-radius:50%;background:var(--ink-100);color:var(--ink-500);
  display:grid;place-items:center;font-size:11.5px;font-weight:500;flex:none}
.aseq.me{background:var(--ink-900);color:#fff}
.awho{flex:1;min-width:0}
.awho b{display:block;font-size:13.5px;font-weight:500;color:var(--ink-900)}
.awho span{display:block;font-size:11.5px;color:var(--ink-400)}
.awho select.apick{width:100%;font-size:13px;padding:7px 9px;border:1px solid var(--red-100);
  border-radius:var(--r-xs);background:var(--red-50);color:var(--ink-900)}
.abox{font-size:11.5px;color:var(--ink-500);white-space:nowrap}
select.abox{border:1px solid var(--ink-200);border-radius:var(--r-xs);padding:5px 7px;
  background:var(--surface);color:var(--ink-700);font-size:11.5px}
.iconbtn.sm{width:26px;height:26px;border-color:transparent}
.iconbtn.sm:hover{border-color:var(--ink-200)}
.aadd{margin-top:12px}
.aadd select{width:100%;font-size:13px;padding:10px 12px;border:1px dashed var(--ink-300);
  border-radius:var(--r-sm);background:var(--surface);color:var(--ink-500)}
/* 결재자 찾기 — 61명 드롭다운 대신 이름을 쳐서 좁힌다 */
.aadd input{width:100%;font-size:13.5px;padding:11px 13px;border:1px solid var(--ink-200);
  border-radius:var(--r-sm);background:var(--surface);color:var(--ink-900);outline:0}
.aadd input:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.acand{margin-top:6px;border:1px solid var(--ink-100);border-radius:var(--r-sm);
  overflow:hidden;max-height:268px;overflow-y:auto}
.acand-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 13px;
  border:0;border-bottom:1px solid var(--ink-100);background:var(--surface);cursor:pointer;
  font:inherit;transition:background var(--t)}
.acand-i:last-child{border-bottom:0}
.acand-i:hover,.acand-i:focus-visible{background:var(--ink-100)}
.acand-i.top{background:var(--red-50)}
.acand-i.top:hover{background:var(--red-100)}
.acand-i b{font-size:13.5px;font-weight:500;color:var(--ink-900);flex:none}
.acand-i span{font-size:11.5px;color:var(--ink-400);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.acand-i .acent{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  color:var(--red);background:var(--surface);border:1px solid var(--red-100);
  border-radius:4px;padding:2px 6px}
.acnone{padding:11px 13px;font-size:12px;color:var(--ink-400);background:var(--sunken)}
.awarn{display:flex;gap:9px;align-items:flex-start;margin-top:16px;padding:11px 13px;
  background:var(--warn-50);border-radius:var(--r-xs);font-size:12.5px;color:var(--warn);line-height:1.55}
.awarn svg{margin-top:2px;flex:none}
.anote{margin-top:14px;font-size:12.5px;color:var(--ink-500);line-height:1.7}
.anote b{color:var(--ink-900);font-weight:500}

/* ── 입력 폼 (운행 고치기 · 추가) ────────────────────────────────── */
.form{border-top:1px solid var(--ink-100);margin-top:4px}
.frow{display:flex;gap:16px;padding:15px 0;border-bottom:1px solid var(--ink-100);align-items:flex-start}
.frow:last-child{border-bottom:0}
.flab{flex:0 0 74px;font-size:12.5px;color:var(--ink-500);padding-top:8px}
.flab .only{display:inline-block;font-size:10px;font-weight:500;color:var(--red);
  background:var(--red-50);border-radius:4px;padding:0 5px;line-height:16px;margin-left:4px}
.fbody{flex:1;min-width:0}
.fhint{font-size:11.5px;color:var(--ink-400);margin-top:7px;line-height:1.6}
.fhint b{color:var(--ink-600);font-weight:500}
.inp{width:100%;font-size:14px;padding:9px 11px;border:1px solid var(--ink-200);
  border-radius:var(--r-xs);background:var(--surface);color:var(--ink-900);
  transition:border-color var(--t),box-shadow var(--t)}
.inp:focus{outline:none;border-color:var(--ink-500);box-shadow:0 0 0 3px var(--ink-100)}
.inp::placeholder{color:var(--ink-400)}
.inp.num{width:126px;text-align:right;font-variant-numeric:tabular-nums}
.inp.pw{max-width:280px}
.unit{font-size:12.5px;color:var(--ink-400);margin-left:7px}
.arrowto{color:var(--ink-400);margin:0 8px;font-size:13px}
.radios{display:flex;flex-wrap:wrap;gap:7px}
.radio{position:relative;   /* 숨긴 input 의 기준. 없으면 패널 좌상단에 포커스 점이 뜬다 */
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--ink-200);
  border-radius:999px;cursor:pointer;font-size:12.5px;color:var(--ink-600);transition:var(--t);user-select:none}
.radio:hover{border-color:var(--ink-400)}
.radio input{position:absolute;opacity:0;width:0;height:0}
.radio:has(input:checked){background:var(--ink-900);border-color:var(--ink-900);color:#fff;font-weight:500}
.radio:has(input:focus-visible){outline:2px solid var(--red);outline-offset:2px}

/* ── 하이패스 대조 ──────────────────────────────────────────────── */
.drop{border:1.5px dashed var(--ink-300);border-radius:var(--r);background:var(--surface);
  padding:36px 24px;text-align:center;transition:var(--t);margin-bottom:16px}
.drop.over{border-color:var(--red);background:var(--red-50)}
.drop .dico{width:46px;height:46px;margin:0 auto 14px;border-radius:13px;background:var(--ink-100);
  display:grid;place-items:center;color:var(--ink-400)}
.drop.over .dico{background:var(--red-100);color:var(--red)}
.drop .dt{font-size:14.5px;font-weight:500;color:var(--ink-900)}
.drop .dd{font-size:12.5px;color:var(--ink-400);margin-top:4px}
.drop label.btn{cursor:pointer}

.hpnote{display:flex;gap:10px;align-items:flex-start;padding:13px 16px;border-radius:var(--r-sm);
  background:var(--ink-50);border:1px solid var(--ink-200);font-size:13px;color:var(--ink-700);
  margin-bottom:14px;line-height:1.6}
.hpnote svg{margin-top:2px;flex:none;color:var(--ink-400)}
.hpnote b{color:var(--ink-900);font-weight:500}
.hpnote.warn{background:var(--warn-50);border-color:#F0E2C4;color:var(--warn)}
.hpnote.warn svg{color:var(--warn)}
.hpnote.warn b{color:var(--warn)}

.hpact{display:flex;align-items:center;gap:14px;justify-content:flex-end;margin-top:13px;
  font-size:12.5px}
.hpact .dim{color:var(--ink-500);margin-right:auto}
.hpact .dim b{color:var(--ink-900);font-weight:500}

.drop label.btn:focus-within{outline:2px solid var(--red);outline-offset:2px}
.hpun{margin-top:11px;border:1px solid var(--ink-200);border-radius:var(--r-sm);background:var(--surface)}
.hpun summary{padding:11px 16px;cursor:pointer;font-size:12.5px;color:var(--ink-600);
  list-style:none;display:flex;align-items:center;gap:7px}
.hpun summary::-webkit-details-marker{display:none}
.hpun summary::before{content:"▸";color:var(--ink-400);font-size:11px}
.hpun[open] summary::before{content:"▾"}
.hpun summary:hover{color:var(--ink-900)}
.hpunb{padding:4px 16px 14px;border-top:1px solid var(--ink-100);font-size:12.5px;
  color:var(--ink-600);max-height:260px;overflow-y:auto}
.hpunb > div{padding:5px 0;border-bottom:1px solid var(--ink-100);display:flex;gap:10px}
.hpunb > div:last-of-type{border-bottom:0}
.hpunb b{color:var(--ink-900);font-weight:500;margin-left:auto;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink-500)}

input[type=checkbox]{width:16px;height:16px;accent-color:var(--red);cursor:pointer;margin:0}

/* ── 토스트 ─────────────────────────────────────────────────────── */
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);z-index:90;
  background:var(--ink-900);color:#fff;padding:12px 19px;border-radius:var(--r-sm);font-size:13px;
  font-weight:400;opacity:0;pointer-events:none;transition:.2s var(--ease);max-width:88vw;box-shadow:var(--pop)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--red-700)}

/* ══════════════════ 인쇄 ══════════════════════════════════════════
   운행기록부 + 영수증을 한 번에 찍는다. 브라우저의 'PDF로 저장' 이 곧 한 권이다.
   한글 글꼴·사진을 브라우저가 이미 갖고 있어 서버에서 PDF 를 만들 이유가 없다.
   화면에서는 #printArea 를 감춰 두고 @media print 에서만 펼친다.          */
#printArea{display:none}

@media print{
  @page{size:A4;margin:11mm 10mm}
  html,body{background:#fff !important;color:#000;font-size:9.5pt}
  header.top,aside,#panel,#toast,main{display:none !important}
  #printArea{display:block}
  .psheet{break-after:page;page-break-after:always}
  .psheet:last-child{break-after:auto;page-break-after:auto}

  .ptitle{margin:0 0 7mm;font-size:17pt;font-weight:700;text-align:center;letter-spacing:.06em}
  .psub{margin:0 0 5mm;text-align:center;font-size:9pt;color:#333}
  .phead{display:flex;gap:5mm;align-items:flex-start;margin-bottom:4mm}
  .pinfo{flex:1;border-collapse:collapse}
  .pinfo th,.pinfo td{border:.4pt solid #000;padding:1.6mm 2.4mm;font-size:9pt}
  .pinfo th{width:24mm;background:#F2F2F2;font-weight:500;text-align:center;white-space:nowrap}
  .pappr{border-collapse:collapse}
  .pappr th,.pappr td{border:.4pt solid #000;text-align:center;font-size:8pt;font-weight:500}
  .pappr th{background:#F2F2F2;padding:1.2mm 2mm;white-space:nowrap}
  .pappr .plabel{width:7mm;padding:0;letter-spacing:.1em}
  .pappr td{width:17mm;height:13mm;vertical-align:middle}
  .psign{font-size:8.5pt;line-height:1.3}
  .psign span{display:block;font-size:6.5pt;color:#555;margin-top:.6mm}
  /* 해당 없는 결재칸 — 대각선 빗금으로 지운다(사내 문서 관행) */
  .pslash{background:
    linear-gradient(to top right,transparent calc(50% - .25pt),#000 50%,transparent calc(50% + .25pt))}

  .psum{width:100%;border-collapse:collapse;margin-bottom:3mm}
  .psum th,.psum td{border:.4pt solid #000;padding:1.6mm 2.4mm;font-size:8.5pt}
  .psum th{background:#F2F2F2;font-weight:500;white-space:nowrap;text-align:center}
  .psum td.n{text-align:right;font-variant-numeric:tabular-nums}

  .plog{width:100%;border-collapse:collapse;table-layout:fixed}
  /* 한글은 break-all 로 끊으면 글자가 뭉개진다. 어절 단위로 접는다. */
  /* ★ white-space 를 반드시 되돌린다. 화면용 tbody td 규칙(262행)이 nowrap 이라,
     인쇄에서도 줄바꿈이 막혀 주소가 옆 칸을 덮어썼다(2026-09-15 실측: 32칸 넘침). */
  .plog th,.plog td{border:.4pt solid #000;padding:1.1mm 1mm;font-size:7.4pt;line-height:1.3;
    white-space:normal;word-break:keep-all;overflow-wrap:anywhere;vertical-align:middle}
  .plog thead th{background:#F2F2F2;font-weight:500;text-align:center;font-size:7.2pt}
  .plog thead{display:table-header-group}         /* 페이지마다 머리글 반복 */
  .plog tr{break-inside:avoid;page-break-inside:avoid}
  .plog td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .plog tfoot th{background:#F2F2F2;text-align:center;font-weight:700}
  .plog tfoot td{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  /* 지역별 분해 행 — 회계가 "총거리×단가" 와 왜 다른지 문서 안에서 보이게 한다(앱 223~240행) */
  .plog tfoot tr.ppart th{background:#FFF;text-align:left;font-weight:400;font-size:7.2pt;color:#333}
  .plog tfoot tr.ppart td{font-weight:400;color:#333}
  .plog tfoot tr.pgrand th{background:#E8E8E8;font-size:8pt}
  .plog tfoot tr.pgrand td{background:#E8E8E8;font-size:8.6pt}
  /* A4 가로 인쇄폭 190mm 를 13칸에 나눈다. 합이 190 을 넘으면 표가 잘린다.
     주소 세 칸(출발·도착·방문처)에 최대한 넉넉히 주는 것이 핵심이다. */
  /* 앱 <cols> 비중에 맞추고, 실측한 글자 필요폭을 담을 수 있게 정한 값(합 189.5mm).
     190mm 에 딱 맞추면 반올림으로 1px 넘친다. */
  .plog th:nth-child(1),.plog td:nth-child(1){width:17.5mm;text-align:center;white-space:nowrap}  /* 운행일자 2026-08-28 = 14.6mm */
  .plog th:nth-child(2),.plog td:nth-child(2){width:23.5mm}                    /* 출발지역 */
  .plog th:nth-child(3),.plog td:nth-child(3){width:23.5mm}                    /* 도착지역 */
  .plog th:nth-child(4),.plog td:nth-child(4){width:18mm}                      /* 방문처 */
  .plog th:nth-child(5),.plog td:nth-child(5){width:13.5mm;text-align:center}  /* 업무구분 일반업무 = 9.6mm */
  .plog th:nth-child(6),.plog td:nth-child(6){width:8.5mm;text-align:center}   /* 입력구분 */
  .plog th:nth-child(7),.plog td:nth-child(7){width:12.5mm}
  .plog th:nth-child(8),.plog td:nth-child(8){width:12.5mm}
  .plog th:nth-child(9),.plog td:nth-child(9){width:12mm}
  .plog th:nth-child(10),.plog td:nth-child(10){width:12.5mm}
  .plog th:nth-child(11),.plog td:nth-child(11){width:11mm}
  .plog th:nth-child(12),.plog td:nth-child(12){width:11mm}
  .plog th:nth-child(13),.plog td:nth-child(13){width:13.5mm}
  .pwarn{margin-top:2.5mm;font-size:7.6pt;color:#333}

  /* 영수증 */
  .prhead{display:flex;align-items:baseline;gap:4mm;border-bottom:.6pt solid #000;
    padding-bottom:1.8mm;margin-bottom:3.5mm}
  .prhead b{font-size:12pt}
  .prhead span{font-size:8.5pt;color:#333}
  .prhead .pg{margin-left:auto}
  .prhead .psum2{font-weight:700;color:#000}
  .prgrid{display:grid;grid-template-columns:1fr 1fr;gap:4mm;height:245mm;align-content:start}
  .prgrid.one{grid-template-columns:1fr;height:248mm}
  .prgrid figure{margin:0;display:flex;flex-direction:column;min-height:0;
    break-inside:avoid;page-break-inside:avoid}
  .prgrid img{width:100%;flex:1;min-height:0;object-fit:contain;border:.4pt solid #BBB}
  .prgrid figcaption{font-size:7.6pt;color:#333;padding-top:1.2mm;text-align:center}
}

/* ── 좁은 화면 ──────────────────────────────────────────────────────
   폰에는 앱이 있으므로 전용 기능을 만들지 않는다.
   앱 서랍의 '웹에서 열기'로 열렸을 때 깨지지 않을 정도만 지킨다.      */
@media (max-width:900px){
  :root{--rail:100%}
  #burger{display:grid}
  .shell{display:block}
  aside{position:fixed;top:var(--head);left:0;right:0;bottom:0;z-index:45;display:none;
    height:auto;border-right:0;padding:10px 12px 44px}
  body.nav-open{overflow:hidden}
  body.nav-open aside{display:block}
  aside a{height:45px}
  main{padding:18px 16px 64px}
  header.top{padding:0 12px;gap:9px}
  .sect > .hd,.hpact{flex-wrap:wrap;row-gap:8px}
  /* 옆으로 밀어도 첫 열(구간·운행)이 보이게 */
  .scroll table td:first-child,.scroll table th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
  tbody tr.tfdone td:first-child{background:var(--sunken)}
  /* 좁은 화면에서는 로고를 줄인다. 예전에는 한글 이름을 숨겨 'ATEC' 만
     남겼는데, 이제 로고 한 덩어리라 숨길 조각이 없다 — 높이로 줄인다. */
  .logo-mark{height:12px}
  .utxt{display:none}
  .cycle{padding:0 10px;gap:6px}
  .cycle .tag,.cycle .yr{display:none}
  .phead h1{font-size:20px}
  .hero{padding:20px 18px;border-radius:var(--r)}
  .verdict{font-size:21px}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
  .fact .v{font-size:18px}
  #panel .sheet{width:100%;top:auto;height:92dvh;border-radius:var(--r-lg) var(--r-lg) 0 0;
    animation:up .3s var(--ease)}
  @keyframes up{from{transform:translateY(32px);opacity:.55}to{transform:none;opacity:1}}
}

/* 작은 폰(≤430px)에서는 ATEC DRIVING 이 헤더를 밀어낸다(360px 에서 27px 넘침).
   그 폭에서는 예전처럼 ATEC 단독 마크만 둔다. */
@media (max-width:430px){
  .logo-mark{display:none}
  .logo-mark.tiny{display:block;height:13px}
}
</style>
</head>
<body>

<!-- ═══ 로그인 ═══ -->
<section id="login">
  <div class="lwrap">
    <img class="logo-lockup" src="brand/atec-lockup.png" alt="ATEC mobility 에이텍모빌리티">
    <h1 class="ltitle">운행일지</h1>
    <p class="ltag">앱에서 쓰시는 아이디로 바로 들어오십니다.<br>따로 가입하실 것 없습니다.</p>
    <div class="fld"><label for="u">아이디</label>
      <input id="u" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="예) ysukim"></div>
    <div class="fld"><label for="p">비밀번호</label>
      <input id="p" type="password" autocomplete="current-password" placeholder="앱 비밀번호"></div>
    <button id="loginBtn">로그인</button>
    <div class="lmsg" id="lmsg" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" style="margin-top:2px"><use href="#i-alert"/></svg>
      <span id="lmsgT"></span></div>
    <p class="lnote">
      앱에서 비밀번호를 바꾸시면 <b>여기도 같이 바뀝니다.</b><br>
      회사 차량 운행기록과 정산 내역을 다룹니다. 공용 PC에서는 <b>반드시 로그아웃</b>해 주세요.
    </p>
  </div>
</section>

<!-- ═══ 본 화면 ═══ -->
<div id="app">
  <header class="top">
    <button class="iconbtn" id="burger" aria-label="메뉴 열기">
      <svg width="18" height="18" viewBox="0 0 24 24"><use href="#i-menu"/></svg></button>
    <button class="appname" data-v="close" aria-label="마감 현황으로">
      <img class="logo-mark" src="brand/atec-driving.png" alt="ATEC Driving">
      <img class="logo-mark tiny" src="brand/atec-mark.png" alt="ATEC">
    </button>
    <div class="sp"></div>
    <label class="cycle" id="cycleBox">
      <svg width="14" height="14" viewBox="0 0 24 24"><use href="#i-cal"/></svg>
      <span id="cycleTxt">—</span><span class="tag" id="cycleTag"></span>
      <svg width="13" height="13" viewBox="0 0 24 24"><use href="#i-down"/></svg>
      <select id="selCycle" aria-label="마감주기 선택"></select>
    </label>
    <button class="uchip" id="uBtn" title="내 정보">
      <span class="uav" id="uAv">—</span>
      <span class="utxt"><b id="uName">—</b><span id="uMeta"></span></span>
    </button>
    <button class="iconbtn" id="logoutBtn" aria-label="로그아웃" title="로그아웃">
      <svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-out"/></svg></button>
  </header>

  <div class="shell">
    <!-- 메뉴 <a> 에는 href 가 없다(주소를 바꾸지 않는 화면 전환이라서).
         그래서 tabindex·role 을 직접 준다 — 없으면 마우스 없이는 화면을 못 바꾼다. -->
    <!-- 메뉴 <a> 에는 href 가 없다(주소를 바꾸지 않는 화면 전환이라서).
         그래서 tabindex·role 을 직접 준다 — 없으면 마우스 없이는 화면을 못 바꾼다.

         ★ 위 '내 운행' 은 누가 보든 본인 것만 나온다(관리자도 마찬가지).
           아래 '관리' 는 관리자에게만 보이고 전 직원이 나온다. 같은 화면을
           범위만 바꿔 쓰므로, 어느 쪽을 보고 있는지 제목으로 구분한다. -->
    <aside id="nav">
      <!-- 마감 작업 순서대로: 현황 → 점검 → 통행료 → 증빙 → 정산. 그 밖의 것은 아래 묶음. -->
      <div class="navsec">이번 달 마감</div>
      <a tabindex="0" role="button" data-v="close" class="on"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-gauge"/></svg>마감 현황</a>
      <a tabindex="0" role="button" data-v="trips"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-list"/></svg>운행일지<span class="pill" id="pTrips" hidden></span></a>
      <a tabindex="0" role="button" data-v="check"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-scan"/></svg>기록 점검<span class="pill" id="pCheck" hidden></span></a>
      <a tabindex="0" role="button" data-v="tollfill"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-ticket"/></svg>통행료 채우기<span class="pill" id="pToll" hidden></span></a>
      <a tabindex="0" role="button" data-v="hipass"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-receipt"/></svg>하이패스 대조</a>
      <a tabindex="0" role="button" data-v="evid"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-receipt"/></svg>증빙<span class="pill" id="pEvid" hidden></span></a>
      <a tabindex="0" role="button" data-v="settle"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-won"/></svg>정산·엑셀</a>
      <div class="navsec">그 밖에</div>
      <a tabindex="0" role="button" data-v="inbox"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-stamp"/></svg>결재함<span class="pill" id="pInbox" hidden></span></a>
      <a tabindex="0" role="button" data-v="safety"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-gauge"/></svg>안전운전</a>
      <a tabindex="0" role="button" data-v="edu"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-play"/></svg>안전교육<span class="pill" id="pEdu" hidden></span></a>
      <a tabindex="0" role="button" data-v="account"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-users"/></svg>내 계정</a>

      <div class="navsec adm">관리</div>
      <a tabindex="0" role="button" data-v="a_close" class="adm"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-gauge"/></svg>전체 마감 현황</a>
      <a tabindex="0" role="button" data-v="a_trips" class="adm"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-list"/></svg>전체 운행일지</a>
      <a tabindex="0" role="button" data-v="a_check" class="adm"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-scan"/></svg>전체 기록 점검</a>
      <a tabindex="0" role="button" data-v="a_evid" class="adm"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-receipt"/></svg>전체 증빙</a>
      <a tabindex="0" role="button" data-v="a_hipass" class="adm"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-ticket"/></svg>하이패스 대조 (전체)</a>
      <a tabindex="0" role="button" data-v="a_settle" class="adm"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-won"/></svg>전체 정산</a>
      <a tabindex="0" role="button" data-v="people" class="adm"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-users"/></svg>직원 현황</a>
      <a tabindex="0" role="button" data-v="cars" class="adm"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-car"/></svg>차량</a>
      <a tabindex="0" role="button" data-v="a_safety" class="adm"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-gauge"/></svg>전체 안전운전</a>
      <a tabindex="0" role="button" data-v="eduadm" class="adm"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-cap"/></svg>교육 관리</a>
      <a tabindex="0" role="button" data-v="perm" class="adm mst"><svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-stamp"/></svg>권한 관리</a>
    </aside>

    <main id="main"><div class="inner" id="inner"></div></main>
  </div>
</div>

<div id="panel">
  <div class="veil" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="ph">
      <div><div class="t" id="pTitle">상세</div><div class="s" id="pSub"></div></div>
      <div class="sp"></div>
      <button class="iconbtn" data-close aria-label="닫기">
        <svg width="17" height="17" viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    </div>
    <div class="pb" id="pBody"></div>
    <div class="pf" id="pFoot"></div>
  </div>
</div>

<!-- 인쇄 전용 영역. 화면에서는 숨어 있고 @media print 에서만 펼쳐진다. -->
<div id="printArea" aria-hidden="true"></div>

<div id="toast" role="status"></div>

<script src="hipass.js"></script>
<script src="xlsx.js"></script>
<script src="driving-app.js"></script>
</body>
</html>
