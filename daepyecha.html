<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대폐차 자재 지급확인서 · ATEC Mobility</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{ --atec-wine:#7A0B3C; --atec-magenta:#C2185B; }
  body{ background:#fdf2f6; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif; }
  .card{ background:#fff; border:1px solid #f3d3e0; border-radius:16px; box-shadow:0 8px 24px -16px rgba(122,11,60,.3); }
  .lbl{ font-size:12px; font-weight:700; color:#7A0B3C; margin-bottom:3px; display:block; }
  .inp{ width:100%; border:1px solid #e7cdd9; border-radius:9px; padding:8px 10px; font-size:14px; background:#fff; }
  .inp:focus{ outline:none; border-color:#C2185B; box-shadow:0 0 0 3px rgba(194,24,91,.12); }
  .btn{ border-radius:10px; font-weight:800; font-size:14px; padding:10px 16px; cursor:pointer; }
  .btn-main{ background:linear-gradient(135deg,#7A0B3C,#C2185B); color:#fff; }
  .btn-out{ background:#fff; border:1.5px solid #C2185B; color:#C2185B; }
  .btn-ghost{ background:#fbeaf1; color:#7A0B3C; }
  .sig-pad{ border:1px dashed #c98aa8; border-radius:10px; background:#fff; touch-action:none; width:100%; height:120px; }
  th.mh{ background:#7A0B3C; color:#fff; font-size:12px; font-weight:700; padding:7px 8px; text-align:left; }
  td.mc{ border:1px solid #eed7e0; padding:4px; }
  /* 인쇄 영역 (PDF 캡처용) */
  #print-area{ position:fixed; left:-9999px; top:0; width:780px; background:#fff; padding:34px 38px; color:#1f2733; font-size:13px; }
  #print-area h2{ text-align:center; font-size:23px; font-weight:800; letter-spacing:6px; color:#111; margin:0 0 4px; }
  #print-area .pa-sub{ text-align:center; color:#666; font-size:12px; margin-bottom:16px; }
  #print-area table{ width:100%; border-collapse:collapse; }
  #print-area .meta td{ border:1px solid #999; padding:7px 9px; font-size:13px; }
  #print-area .meta .k{ background:#f3e6ec; font-weight:700; width:110px; }
  #print-area .mat th, #print-area .mat td{ border:1px solid #999; padding:6px 8px; font-size:12.5px; }
  #print-area .mat th{ background:#7A0B3C; color:#fff; }
  #print-area .sign-row{ display:flex; gap:30px; margin-top:22px; }
  #print-area .sign-box{ flex:1; border:1px solid #999; border-radius:6px; padding:10px 12px; }
  #print-area .sign-box .st{ font-weight:700; font-size:12px; color:#7A0B3C; margin-bottom:4px; }
  #print-area .sign-img{ height:64px; }
</style>
</head>
<body>
<div class="max-w-3xl mx-auto px-4 py-6">

  <!-- header -->
  <div class="flex items-center justify-between mb-5">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-[#C2185B] text-sm font-bold hover:underline">← 포털</a>
      <h1 class="text-lg font-extrabold text-[#7A0B3C]">대폐차 자재 지급확인서</h1>
    </div>
    <span id="user-badge" class="text-[11px] text-slate-500"></span>
  </div>

  <!-- 작성 폼 -->
  <div class="card p-5 mb-5">
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-3">
      <div><label class="lbl">작성일</label><input id="f-date" class="inp" type="date"></div>
      <div><label class="lbl">센터</label><select id="f-center" class="inp"></select></div>
      <div><label class="lbl">운수사</label><input id="f-operator" class="inp" placeholder="예) 다모아"></div>
      <div><label class="lbl">신규 차량번호</label><input id="f-vehicle" class="inp" placeholder="예) 서울70사1234"></div>
      <div><label class="lbl">대폐차(폐차) 번호</label><input id="f-scrap" class="inp" placeholder="폐차 차량번호"></div>
      <div><label class="lbl">단말기 기종</label><select id="f-model" class="inp"></select></div>
    </div>

    <!-- 자재 항목 -->
    <div class="flex items-center justify-between mt-2 mb-1">
      <label class="lbl mb-0">지급 자재 내역</label>
      <button class="btn btn-ghost py-1.5 px-3 text-[12px]" onclick="addRow()">+ 품목 추가</button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full" style="border-collapse:collapse">
        <thead><tr>
          <th class="mh" style="width:34%">품명</th>
          <th class="mh" style="width:13%">수량</th>
          <th class="mh" style="width:30%">S/N</th>
          <th class="mh">비고</th>
          <th class="mh" style="width:36px"></th>
        </tr></thead>
        <tbody id="mat-body"></tbody>
      </table>
    </div>

    <!-- 서명 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-5">
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="lbl mb-0">지급자 (ATEC)</label>
          <button class="text-[11px] text-slate-400 hover:text-[#C2185B]" onclick="SIG.issuer.clear()">서명 지우기</button>
        </div>
        <input id="f-issuer" class="inp mb-2" placeholder="지급자 이름">
        <canvas id="sig-issuer" class="sig-pad" width="600" height="240"></canvas>
      </div>
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="lbl mb-0">수령자 (운수사)</label>
          <button class="text-[11px] text-slate-400 hover:text-[#C2185B]" onclick="SIG.receiver.clear()">서명 지우기</button>
        </div>
        <input id="f-receiver" class="inp mb-2" placeholder="수령자 이름">
        <canvas id="sig-receiver" class="sig-pad" width="600" height="240"></canvas>
      </div>
    </div>

    <div class="mt-4"><label class="lbl">메모</label><textarea id="f-memo" class="inp" rows="2"></textarea></div>

    <div class="flex flex-wrap gap-2 mt-5">
      <button class="btn btn-out" onclick="downloadPdf()">PDF 다운로드</button>
      <button class="btn btn-main" id="save-btn" onclick="saveCloud()">서명·확인서 저장 (60일 보관)</button>
    </div>
    <p class="text-[11px] text-slate-400 mt-2">저장 시 PDF가 클라우드에 60일간 보관되며, 이후 자동 삭제됩니다. 원본 PDF는 다운로드해 따로 보관할 수 있습니다.</p>
  </div>

  <!-- 보관 목록 -->
  <div class="card p-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-extrabold text-[#7A0B3C]">최근 확인서 (최대 60일)</h2>
      <button class="text-[12px] text-[#C2185B] font-bold" onclick="loadList()">새로고침</button>
    </div>
    <div id="list-box" class="text-[13px] text-slate-500">불러오는 중…</div>
  </div>
</div>

<!-- PDF 캡처용 인쇄 영역 -->
<div id="print-area"></div>

<script src="form-common.js"></script>
<script>
var SIG = {};
var MAT_PRESETS = ['통합단말기','승차 단말기','하차1 단말기','하차2 단말기','카드리더','정산기','전원 케이블','통신 케이블','GPS 안테나','모뎀/라우터','표출기','DTG','거치대/브라켓','기타'];

function el(id){ return document.getElementById(id); }

function initSelects(){
  el('f-center').innerHTML = '<option value="">선택</option>' + FC.CENTERS.map(function(c){return '<option>'+c+'</option>';}).join('');
  el('f-model').innerHTML = '<option value="">선택</option>' + FC.MODELS.map(function(m){return '<option>'+m+'</option>';}).join('');
  el('f-date').value = FC.todayStr();
  var b = el('user-badge'); b.textContent = FC.myEmail() ? ('작성자 · ' + FC.myEmail()) : '비로그인';
}

function rowHtml(){
  var opts = MAT_PRESETS.map(function(m){return '<option>'+m+'</option>';}).join('');
  return '<tr>'+
    '<td class="mc"><select class="inp r-name" style="padding:6px 8px"><option value="">품명</option>'+opts+'</select></td>'+
    '<td class="mc"><input class="inp r-qty" type="number" min="0" value="1" style="padding:6px 8px"></td>'+
    '<td class="mc"><input class="inp r-sn" placeholder="S/N" style="padding:6px 8px"></td>'+
    '<td class="mc"><input class="inp r-note" style="padding:6px 8px"></td>'+
    '<td class="mc" style="text-align:center"><button onclick="this.closest(\'tr\').remove()" class="text-slate-400 hover:text-red-500 font-bold">✕</button></td>'+
  '</tr>';
}
function addRow(){ el('mat-body').insertAdjacentHTML('beforeend', rowHtml()); }

function collectItems(){
  var rows = el('mat-body').querySelectorAll('tr'), out = [];
  rows.forEach(function(r){
    var name = r.querySelector('.r-name').value.trim();
    if(!name) return;
    out.push({ name:name, qty:Number(r.querySelector('.r-qty').value||0),
               sn:r.querySelector('.r-sn').value.trim(), note:r.querySelector('.r-note').value.trim() });
  });
  return out;
}

function gather(){
  return {
    date: el('f-date').value, center: el('f-center').value, operator: el('f-operator').value.trim(),
    vehicle: el('f-vehicle').value.trim(), scrap: el('f-scrap').value.trim(), model: el('f-model').value,
    issuer: el('f-issuer').value.trim(), receiver: el('f-receiver').value.trim(),
    memo: el('f-memo').value.trim(), items: collectItems()
  };
}

function buildPrint(d){
  var pa = el('print-area');
  var rows = d.items.length ? d.items.map(function(it,i){
    return '<tr><td style="text-align:center">'+(i+1)+'</td><td>'+esc(it.name)+'</td><td style="text-align:center">'+it.qty+'</td><td>'+esc(it.sn||'-')+'</td><td>'+esc(it.note||'')+'</td></tr>';
  }).join('') : '<tr><td colspan="5" style="text-align:center;color:#999">지급 자재 없음</td></tr>';
  var iSig = SIG.issuer.dataUrl(), rSig = SIG.receiver.dataUrl();
  pa.innerHTML =
    '<h2>자재 지급확인서</h2><div class="pa-sub">대폐차 단말기 자재 지급 · ATEC Mobility</div>'+
    '<table class="meta"><tr><td class="k">작성일</td><td>'+esc(d.date)+'</td><td class="k">센터</td><td>'+esc(d.center||'-')+'</td></tr>'+
    '<tr><td class="k">운수사</td><td>'+esc(d.operator||'-')+'</td><td class="k">단말기 기종</td><td>'+esc(d.model||'-')+'</td></tr>'+
    '<tr><td class="k">신규 차량</td><td>'+esc(d.vehicle||'-')+'</td><td class="k">대폐차 번호</td><td>'+esc(d.scrap||'-')+'</td></tr></table>'+
    '<div style="height:12px"></div>'+
    '<table class="mat"><thead><tr><th style="width:34px">No</th><th>품명</th><th style="width:48px">수량</th><th style="width:170px">S/N</th><th>비고</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    (d.memo? '<div style="margin-top:12px;font-size:12px"><b>메모</b> · '+esc(d.memo)+'</div>':'')+
    '<div class="sign-row">'+
      '<div class="sign-box"><div class="st">지급자 (ATEC)</div><div>'+esc(d.issuer||'')+'</div>'+(iSig?'<img class="sign-img" src="'+iSig+'">':'<div class="sign-img"></div>')+'</div>'+
      '<div class="sign-box"><div class="st">수령자 (운수사)</div><div>'+esc(d.receiver||'')+'</div>'+(rSig?'<img class="sign-img" src="'+rSig+'">':'<div class="sign-img"></div>')+'</div>'+
    '</div>'+
    '<div style="text-align:right;color:#999;font-size:10px;margin-top:14px">발행 '+new Date().toLocaleString('ko-KR')+' · '+esc(FC.myEmail()||'')+'</div>';
  return pa;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

function validate(d){
  if(!d.center){ FC.toast('센터를 선택하세요', false); return false; }
  if(!d.vehicle){ FC.toast('신규 차량번호를 입력하세요', false); return false; }
  if(!d.items.length){ FC.toast('지급 자재를 1건 이상 입력하세요', false); return false; }
  return true;
}

function fileName(d){   // 다운로드용(한글 OK)
  return (d.vehicle||'차량') + '_대폐차확인서_' + FC.stampSlug() + '.pdf';
}
function storeKey(d){   // 스토리지 경로(영문/숫자만)
  return (FC.ascii(d.center)||'etc') + '/' + (FC.ascii(d.vehicle)||'veh') + '_' + FC.stampSlug() + '_' + FC.rand4() + '.pdf';
}

function downloadPdf(){
  var d = gather(); if(!validate(d)) return;
  FC.nodeToPdf(buildPrint(d)).then(function(blob){
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = fileName(d); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
    FC.toast('PDF 다운로드 완료');
  }).catch(function(e){ FC.toast('PDF 생성 실패: '+e.message, false); });
}

var saving = false, lastSig = '';
function saveCloud(){
  var d = gather(); if(!validate(d)) return;
  if(!FC.cloudAvailable()){ FC.toast('클라우드 미연결 — PDF 다운로드만 가능', false); return; }
  var sig = JSON.stringify(d);
  if(saving || sig === lastSig){ FC.toast('이미 저장되었습니다'); return; }
  saving = true; el('save-btn').disabled = true; el('save-btn').textContent = '저장 중…';
  var path = storeKey(d);
  FC.nodeToPdf(buildPrint(d)).then(function(blob){
    return FC.uploadPdf('daepyecha', path, blob);
  }).then(function(){
    return FC.restInsert('daepyecha_confirmations', {
      center:d.center, operator:d.operator, vehicle_no:d.vehicle, model:d.model, scrap_no:d.scrap,
      items:d.items, issuer:d.issuer, receiver:d.receiver,
      issuer_sign:!SIG.issuer.isEmpty(), receiver_sign:!SIG.receiver.isEmpty(),
      pdf_path:path, memo:d.memo, created_by:FC.myEmail()
    });
  }).then(function(){
    lastSig = sig; FC.toast('저장되었습니다'); loadList();
  }).catch(function(e){
    FC.toast('저장 실패: '+e.message, false);
  }).then(function(){
    saving = false; el('save-btn').disabled = false; el('save-btn').textContent = '서명·확인서 저장 (60일 보관)';
  });
}

function loadList(){
  var box = el('list-box');
  if(!FC.cloudAvailable()){ box.textContent = '클라우드 미연결'; return; }
  box.textContent = '불러오는 중…';
  FC.restSelect('daepyecha_confirmations','select=id,center,vehicle_no,model,created_at,pdf_path,created_by&order=created_at.desc&limit=50')
  .then(function(rows){
    if(!rows.length){ box.innerHTML = '<span class="text-slate-400">아직 저장된 확인서가 없습니다.</span>'; return; }
    box.innerHTML = '<div class="divide-y divide-rose-50">' + rows.map(function(r){
      var dt = (r.created_at||'').replace('T',' ').slice(0,16);
      var del = FC.isAdmin() ? '<button onclick="delRec(\''+r.id+'\',\''+enc(r.pdf_path)+'\')" class="text-[11px] text-red-500 hover:underline ml-2">삭제</button>' : '';
      return '<div class="flex items-center justify-between py-2">'+
        '<div><b class="text-[#7A0B3C]">'+esc(r.vehicle_no||'-')+'</b> <span class="text-slate-400">· '+esc(r.center||'')+' · '+esc(r.model||'')+'</span><div class="text-[11px] text-slate-400">'+dt+' · '+esc(r.created_by||'')+'</div></div>'+
        '<div><button onclick="openPdf(\''+enc(r.pdf_path)+'\')" class="text-[12px] text-[#C2185B] font-bold hover:underline">PDF 열기</button>'+del+'</div></div>';
    }).join('') + '</div>';
  }).catch(function(e){ box.textContent = '목록 오류: '+e.message; });
}
function enc(s){ return encodeURIComponent(s||''); }
function openPdf(p){
  FC.signedUrl('daepyecha', decodeURIComponent(p), 600).then(function(u){
    if(u) window.open(u,'_blank'); else FC.toast('링크 생성 실패', false);
  });
}
function delRec(id, p){
  if(!FC.isAdmin()){ FC.toast('삭제는 관리자만 가능합니다', false); return; }
  if(!confirm('이 확인서를 삭제할까요? (PDF도 함께 삭제)')) return;
  FC.removePdf('daepyecha', decodeURIComponent(p)).then(function(){
    return FC.restDelete('daepyecha_confirmations','id=eq.'+id);
  }).then(function(){ FC.toast('삭제되었습니다'); loadList(); })
  .catch(function(e){ FC.toast('삭제 실패: '+e.message, false); });
}

// init
initSelects();
SIG.issuer = FC.SignaturePad(el('sig-issuer'));
SIG.receiver = FC.SignaturePad(el('sig-receiver'));
addRow();
loadList();
</script>
</body>
</html>
