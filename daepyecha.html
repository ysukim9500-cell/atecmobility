<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대폐차 자재 지급확인서 · ATEC Mobility</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="assets/atec-ci.css">
<style>
  :root{ --wine:#A00040; --mag:#D60051; --ink:#1f2733; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#f6eef2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif; }
  .wrap{ max-width:920px; margin:0 auto; padding:0 16px 60px; }
  .fg3{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .fg2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .qact{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .qact .btn{ flex:1 1 auto; }
  @media(max-width:600px){
    .wrap{ padding:0 12px 50px; }
    .fg3{ grid-template-columns:1fr; }
    .fg2{ grid-template-columns:1fr; }
    .card{ padding:16px; }
    .tab{ font-size:13px; padding:9px; }
    .qact{ display:grid; grid-template-columns:1fr 1fr; }
    .qact .btn-main{ grid-column:1 / -1; }
  }
  .topbar{ background:linear-gradient(120deg,#5e0a2e,#A00040 45%,#D60051); color:#fff; }
  .topbar-in{ max-width:920px; margin:0 auto; padding:18px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand .logo{ width:38px; height:38px; border-radius:11px; background:rgba(255,255,255,.16); display:grid; place-items:center; }
  .brand h1{ font-size:17px; font-weight:800; margin:0; letter-spacing:-.2px; }
  .brand p{ font-size:11.5px; margin:2px 0 0; color:#f6c9da; }
  .back{ color:#fff; font-size:12.5px; font-weight:700; text-decoration:none; opacity:.92; }
  .back:hover{ opacity:1; }
  .tabs{ display:flex; gap:4px; background:#fff; border:1px solid #efd6e1; border-radius:13px; padding:5px; margin:20px 0 18px; box-shadow:0 8px 22px -16px rgba(160,0,64,.35); }
  .tab{ flex:1; text-align:center; padding:10px; border-radius:9px; font-weight:800; font-size:14px; color:#9a7384; cursor:pointer; border:none; background:none; }
  .tab.on{ background:linear-gradient(135deg,#A00040,#D60051); color:#fff; box-shadow:0 6px 14px -6px rgba(194,24,91,.5); }
  .card{ background:#fff; border:1px solid #efd6e1; border-radius:16px; box-shadow:0 10px 30px -22px rgba(160,0,64,.4); padding:22px; }
  .sec-ttl{ font-size:12.5px; font-weight:800; color:var(--wine); display:flex; align-items:center; gap:7px; margin:0 0 12px; }
  .sec-ttl::before{ content:""; width:4px; height:15px; border-radius:3px; background:linear-gradient(#A00040,#D60051); }
  .lbl{ font-size:11.5px; font-weight:700; color:#86566b; margin-bottom:4px; display:block; }
  .inp{ width:100%; border:1px solid #e3c8d4; border-radius:10px; padding:9px 11px; font-size:14px; background:#fff; transition:.12s; }
  .inp:focus{ outline:none; border-color:var(--mag); box-shadow:0 0 0 3px rgba(194,24,91,.13); }
  select.inp{ appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23C2185B' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 9px center; padding-right:30px; }
  .btn{ border-radius:11px; font-weight:800; font-size:13.5px; padding:10px 16px; cursor:pointer; border:none; }
  .btn-main{ background:linear-gradient(135deg,#A00040,#D60051); color:#fff; box-shadow:0 8px 18px -8px rgba(194,24,91,.55); }
  .btn-main:disabled{ opacity:.55; }
  .btn-out{ background:#fff; border:1.5px solid #D60051; color:#D60051; }
  .btn-soft{ background:#f7e7ef; color:#A00040; }
  .btn-soft:hover{ background:#f1d6e3; }
  /* 자재 항목 카드 */
  .mat-item{ border:1px solid #eedbe6; border-radius:12px; padding:11px 12px; margin-bottom:9px; background:#fffafc; }
  .mi-top{ display:flex; align-items:center; gap:9px; }
  .mi-no{ font-weight:800; color:#b0367a; font-size:13px; min-width:20px; text-align:center; }
  .mi-top .r-name{ flex:1; min-width:0; }
  .mi-del{ background:none; border:none; color:#c98; cursor:pointer; font-weight:700; font-size:17px; line-height:1; padding:2px 6px; flex-shrink:0; }
  .mi-grid{ display:grid; grid-template-columns:92px 1fr; gap:9px; margin-top:9px; align-items:end; }
  .mi-lbl{ font-size:10.5px; font-weight:700; color:#a4587d; display:block; margin-bottom:3px; }
  .mi-grid .inp{ padding:7px 9px; }
  .sig-pad{ border:1.5px dashed #d09cb4; border-radius:11px; background:linear-gradient(#fff,#fdf7fa); touch-action:none; width:100%; height:118px; }
  .pill{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; background:#f7e7ef; color:#9a3768; }
  .res-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px solid #f3e3eb; }
  .cat-chip{ display:inline-block; font-size:10px; font-weight:800; padding:1px 7px; border-radius:6px; }
  .hide{ display:none !important; }
  #print-area{ position:fixed; left:-99999px; top:0; width:794px; background:#fff; padding:30px 34px; color:#15202b; font-family:'Noto Sans KR',sans-serif; }
  .doc-page{ width:794px; height:1123px; background:#fff; box-sizing:border-box; display:flex; overflow:hidden; }
  .doc-frame{ flex:1; margin:16px; border:1.6px solid #A00040; padding:28px 32px 22px; display:flex; flex-direction:column; }
  .doc-confirm{ text-align:center; font-size:12.5px; color:#3a3a3a; padding-top:26px; }
  .doc-date{ text-align:center; font-size:13.5px; font-weight:700; letter-spacing:3px; margin:9px 0 16px; color:#222; }
  .doc-sign{ display:flex; gap:20px; }
  .doc-sign .b{ flex:1; border:1px solid #9a9a9a; border-radius:6px; padding:10px 14px; min-height:108px; position:relative; }
  .doc-sign .role{ font-size:11.5px; font-weight:800; color:#A00040; }
  .doc-sign .nm{ display:block; font-size:13.5px; margin-top:4px; }
  .doc-sign .seal{ color:#b07; font-size:11px; }
  .doc-sign img{ position:absolute; right:18px; bottom:10px; height:62px; }
  #pa-head{ display:flex; align-items:flex-start; justify-content:space-between; border-bottom:2.5px solid #A00040; padding-bottom:10px; margin-bottom:4px; }
  #pa-head .t{ font-size:25px; font-weight:800; letter-spacing:7px; color:#111; }
  #pa-head .s{ font-size:11px; color:#A00040; font-weight:700; margin-top:3px; letter-spacing:1px; }
  #pa-head .co{ text-align:right; font-size:10.5px; color:#666; line-height:1.5; }
  #pa-head .co b{ color:#A00040; font-size:13px; letter-spacing:1px; }
  .pa-meta{ width:100%; border-collapse:collapse; margin:12px 0 6px; }
  .pa-meta td{ border:1px solid #b9b9b9; padding:6px 9px; font-size:12px; }
  .pa-meta .k{ background:#f2e6ec; font-weight:700; width:92px; color:#5e1334; }
  .pa-cols{ display:flex; gap:14px; align-items:flex-start; }
  .pa-cols > div{ flex:1; }
  table.pa-items{ width:100%; border-collapse:collapse; }
  table.pa-items th{ background:#A00040; color:#fff; font-size:10.5px; padding:5px 6px; border:1px solid #A00040; }
  table.pa-items td{ border:1px solid #cfcfcf; padding:4px 6px; font-size:10.5px; }
  table.pa-items tr:nth-child(even) td{ background:#faf3f7; }
  .pa-sign{ display:flex; gap:18px; margin-top:16px; }
  .pa-sign .b{ flex:1; border:1px solid #b9b9b9; border-radius:7px; padding:9px 12px; min-height:96px; }
  .pa-sign .st{ font-size:11px; font-weight:700; color:#A00040; }
  .pa-sign .nm{ font-size:12.5px; margin-top:2px; }
  .pa-sign img{ height:58px; margin-top:4px; }
  .pa-foot{ text-align:right; font-size:9px; color:#9a9a9a; margin-top:12px; }
  table.pa-list{ width:100%; border-collapse:collapse; margin-top:10px; }
  table.pa-list th{ background:#A00040; color:#fff; font-size:10px; padding:5px 6px; border:1px solid #A00040; }
  table.pa-list td{ border:1px solid #cfcfcf; padding:4px 6px; font-size:10px; }
  table.pa-list tr:nth-child(even) td{ background:#faf3f7; }
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <div class="brand">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M7 4h7l4 4v12a1 1 0 01-1 1H7a1 1 0 01-1-1V5a1 1 0 011-1z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/><path d="M13 4v5h5M9 13h6M9 16h4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg></div>
    <div><h1>대폐차 자재 지급확인서</h1>
      <p style="display:flex;align-items:center;gap:6px"><img src="assets/atec-logo.png" alt="ATEC 에이텍모빌리티" class="atec-mark on-dark" style="height:12px"> · 증차 · 대폐차 · 감차 전자 서식</p></div>
  </div>
  <a href="index.html" class="back">← 포털</a>
</div></div>

<div class="wrap">
  <div class="tabs">
    <button class="tab on" id="tab-write" onclick="showTab('write')">서식 작성</button>
    <button class="tab" id="tab-browse" onclick="showTab('browse')">조회 · 다운로드</button>
  </div>

  <!-- 작성 -->
  <div id="pane-write">
    <div class="card" style="margin-bottom:16px">
      <div class="sec-ttl">기본 정보</div>
      <div class="fg3">
        <div><label class="lbl">작성일</label><input id="f-date" class="inp" type="date"></div>
        <div><label class="lbl">센터</label><select id="f-center" class="inp"></select></div>
        <div><label class="lbl">운수사</label><input id="f-operator" class="inp" placeholder="예) 다모아자동차"></div>
        <div><label class="lbl">구분</label><select id="f-category" class="inp" onchange="onCategory()"><option>대폐차</option><option>증차</option><option>감차</option></select></div>
        <div><label class="lbl">단말기 기종</label><select id="f-model" class="inp" onchange="onModel()"></select></div>
        <div><label class="lbl" id="lbl-vehicle">차량번호</label><input id="f-vehicle" class="inp" placeholder="예) 서울74사1234"></div>
      </div>
      <p id="cat-hint" class="text-[11.5px]" style="color:#a98;margin-top:8px"></p>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div class="sec-ttl" style="margin:0">지급 자재 내역 <span class="pill" id="mat-count">0개</span></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-soft" style="padding:7px 12px;font-size:12px" onclick="loadAllItems()">전체 품목 불러오기</button>
          <button class="btn btn-soft" style="padding:7px 12px;font-size:12px" onclick="addRow()">+ 품목 추가</button>
          <button class="btn btn-soft" style="padding:7px 12px;font-size:12px;color:#b91c1c;background:#fdeaea" onclick="clearRows()">비우기</button>
        </div>
      </div>
      <p id="mat-hint" class="text-[11.5px]" style="color:#a98;margin-bottom:10px">기종을 먼저 선택하면 해당 기종의 품명이 드롭다운에 채워집니다. "기타"는 직접 입력할 수 있어요.</p>
      <div id="mat-body"></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="sec-ttl">서명</div>
      <div class="fg2">
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
            <label class="lbl" style="margin:0">지급자 (ATEC)</label>
            <button class="text-[11px]" style="color:#b08;background:none;border:none;cursor:pointer" onclick="SIG.issuer.clear()">지우기</button>
          </div>
          <input id="f-issuer" class="inp" style="margin-bottom:8px" placeholder="지급자 이름">
          <canvas id="sig-issuer" class="sig-pad" width="640" height="236"></canvas>
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
            <label class="lbl" style="margin:0">수령자 (운수사)</label>
            <button class="text-[11px]" style="color:#b08;background:none;border:none;cursor:pointer" onclick="SIG.receiver.clear()">지우기</button>
          </div>
          <input id="f-receiver" class="inp" style="margin-bottom:8px" placeholder="수령자 이름">
          <canvas id="sig-receiver" class="sig-pad" width="640" height="236"></canvas>
        </div>
      </div>
      <div style="margin-top:14px"><label class="lbl">메모</label><textarea id="f-memo" class="inp" rows="2" placeholder="특이사항"></textarea></div>
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px">
        <button class="btn btn-out" onclick="downloadPdf()">PDF 미리보기 · 다운로드</button>
        <button class="btn btn-main" id="save-btn" onclick="saveCloud()">서명 · 확인서 저장 (60일 보관)</button>
      </div>
      <p class="text-[11px]" style="color:#b09; margin-top:8px">PDF는 품목이 많아도 <b>A4 한 장</b>에 정렬되어 출력됩니다. 저장 시 클라우드에 60일 보관 후 자동 삭제됩니다.</p>
    </div>
  </div>

  <!-- 조회 -->
  <div id="pane-browse" class="hide">
    <div class="card" style="margin-bottom:16px">
      <div class="sec-ttl">조회 조건</div>
      <div class="fg3">
        <div><label class="lbl">시작일</label><input id="q-from" class="inp" type="date"></div>
        <div><label class="lbl">종료일</label><input id="q-to" class="inp" type="date"></div>
        <div><label class="lbl">구분</label><select id="q-category" class="inp"><option value="">전체</option><option>대폐차</option><option>증차</option><option>감차</option></select></div>
        <div><label class="lbl">센터</label><select id="q-center" class="inp"></select></div>
        <div><label class="lbl">기종</label><select id="q-model" class="inp"></select></div>
        <div><label class="lbl">차량번호 검색</label><input id="q-vehicle" class="inp" placeholder="번호 일부 (선택)"></div>
      </div>
      <div class="qact">
        <button class="btn btn-main" onclick="runQuery()">조회</button>
        <button class="btn btn-out" onclick="exportZip()">PDF 일괄 (ZIP)</button>
        <button class="btn btn-out" onclick="exportCsv()">CSV</button>
        <button class="btn btn-soft" onclick="quickRange(7)">최근 7일</button>
        <button class="btn btn-soft" onclick="quickRange(30)">최근 30일</button>
      </div>
    </div>
    <div class="card">
      <div class="sec-ttl" style="margin-bottom:8px">조회 결과 <span class="pill" id="q-count">0건</span></div>
      <div id="q-results" style="font-size:13px;color:#86566b">조회 버튼을 눌러 결과를 확인하세요.</div>
    </div>
  </div>
</div>

<div id="print-area"></div>

<script src="form-common.js"></script>

function validate(d){
  if(!d.center){ FC.toast('센터를 선택하세요', false); return false; }
  if(!d.model){ FC.toast('기종을 선택하세요', false); return false; }
  if(!d.vehicle){ FC.toast((CAT_LABEL[d.category]||'차량번호')+'를 입력하세요', false); return false; }
  if(!d.items.length){ FC.toast('지급 자재를 1건 이상 입력하세요', false); return false; }
  return true;
}
function dlName(d){ return (d.vehicle||'차량')+'_'+(d.category||'대폐차')+'_'+FC.stampSlug()+'.pdf'; }
function storeKey(d){ return (FC.ascii(d.center)||'etc')+'/'+(FC.ascii(d.vehicle)||'veh')+'_'+FC.stampSlug()+'_'+FC.rand4()+'.pdf'; }

function downloadPdf(){
  var d=gather(); if(!validate(d)) return;
  FC.nodeToPdfFit(buildPrint(d)).then(function(blob){
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=dlName(d); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1500); FC.toast('PDF 다운로드 완료');
  }).catch(function(e){ FC.toast('PDF 생성 실패: '+e.message, false); });
}

var saving=false, lastSig='';
function saveCloud(){
  var d=gather(); if(!validate(d)) return;
  if(!FC.cloudAvailable()){ FC.toast('클라우드 미연결 — PDF 다운로드만 가능', false); return; }
  var sig=JSON.stringify(d);
  if(saving||sig===lastSig){ FC.toast('이미 저장되었습니다'); return; }
  saving=true; el('save-btn').disabled=true; el('save-btn').textContent='저장 중…';
  var path=storeKey(d);
  FC.nodeToPdfFit(buildPrint(d)).then(function(blob){ return FC.uploadPdf('daepyecha', path, blob); })
  .then(function(){
    return FC.restInsert('daepyecha_confirmations', { center:d.center, operator:d.operator, category:d.category, vehicle_no:d.vehicle, model:d.model,
      items:d.items, issuer:d.issuer, receiver:d.receiver, issuer_sign:!SIG.issuer.isEmpty(), receiver_sign:!SIG.receiver.isEmpty(),
      pdf_path:path, memo:d.memo, created_by:FC.myEmail() });
  }).then(function(){ lastSig=sig; FC.toast('저장되었습니다'); })
  .catch(function(e){ FC.toast('저장 실패: '+e.message, false); })
  .then(function(){ saving=false; el('save-btn').disabled=false; el('save-btn').textContent='서명 · 확인서 저장 (60일 보관)'; });
}

/* 조회/다운로드 */
function quickRange(days){
  var to=new Date(), from=new Date(Date.now()-days*86400000);
  var f=function(x){ var p=function(n){return('0'+n).slice(-2);}; return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate()); };
  el('q-from').value=f(from); el('q-to').value=f(to); runQuery();
}
function buildFilter(){
  var qs='select=id,category,center,operator,vehicle_no,model,items,created_at,created_by,pdf_path&order=created_at.desc&limit=300';
  var from=el('q-from').value, to=el('q-to').value, cat=el('q-category').value, c=el('q-center').value, m=el('q-model').value, v=el('q-vehicle').value.trim();
  if(from) qs+='&created_at=gte.'+from+'T00:00:00';
  if(to) qs+='&created_at=lte.'+to+'T23:59:59';
  if(cat) qs+='&category=eq.'+encodeURIComponent(cat);
  if(c) qs+='&center=eq.'+encodeURIComponent(c);
  if(m) qs+='&model=eq.'+encodeURIComponent(m);
  if(v) qs+='&vehicle_no=ilike.*'+encodeURIComponent(v)+'*';
  return qs;
}
var lastRows=[];
function runQuery(){
  var box=el('q-results');
  if(!FC.cloudAvailable()){ box.textContent='클라우드 미연결'; return; }
  box.textContent='조회 중…';
  FC.restSelect('daepyecha_confirmations', buildFilter()).then(function(rows){
    lastRows=rows; el('q-count').textContent=rows.length+'건';
    if(!rows.length){ box.innerHTML='<span style="color:#bba">조건에 맞는 확인서가 없습니다.</span>'; return; }
    box.innerHTML=rows.map(function(r){
      var dt=(r.created_at||'').replace('T',' ').slice(0,16);
      var cnt=Array.isArray(r.items)?r.items.length:0;
      var cat=r.category||'대폐차';
      var chip='<span class="cat-chip" style="'+(CAT_COLOR[cat]||CAT_COLOR['대폐차'])+'">'+esc(cat)+'</span>';
      var del=FC.isAdmin()?'<button onclick="delRec(\''+r.id+'\',\''+encodeURIComponent(r.pdf_path||'')+'\')" style="color:#dc2626;background:none;border:none;cursor:pointer;font-size:12px;margin-left:8px">삭제</button>':'';
      return '<div class="res-row"><div>'+chip+' <b style="color:#A00040">'+esc(r.vehicle_no||'-')+'</b> <span style="color:#bba">· '+esc(r.center||'')+' · '+esc(r.model||'')+' · '+cnt+'개</span>'+
        '<div style="font-size:11px;color:#bba">'+dt+' · '+esc(r.operator||'')+' · '+esc(r.created_by||'')+'</div></div>'+
        '<div style="white-space:nowrap"><button onclick="openPdf(\''+encodeURIComponent(r.pdf_path||'')+'\')" style="color:#D60051;background:none;border:none;cursor:pointer;font-weight:700;font-size:12.5px">PDF</button>'+del+'</div></div>';
    }).join('');
  }).catch(function(e){ box.textContent='조회 오류: '+e.message; });
}
// 조회된 각 건의 PDF를 ZIP으로 묶어 다운로드
async function exportZip(){
  if(!lastRows.length){ FC.toast('먼저 조회하세요', false); return; }
  if(typeof JSZip==='undefined'){ FC.toast('압축 모듈 로딩 실패 — 새로고침 후 재시도', false); return; }
  FC.toast('PDF '+lastRows.length+'건 압축 중…');
  var zip=new JSZip(), ok=0;
  for(var i=0;i<lastRows.length;i++){
    var r=lastRows[i]; if(!r.pdf_path) continue;
    try{
      var url=await FC.signedUrl('daepyecha', r.pdf_path, 600);
      if(!url) continue;
      var blob=await (await fetch(url)).blob();
      var nm=(r.vehicle_no||'차량')+'_'+(r.category||'대폐차')+'_'+(r.created_at||'').slice(0,10)+'_'+(i+1)+'.pdf';
      zip.file(nm, blob); ok++;
    }catch(e){}
  }
  if(!ok){ FC.toast('다운로드할 PDF가 없습니다', false); return; }
  var content=await zip.generateAsync({type:'blob'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(content); a.download='대폐차_지급확인서_'+FC.stampSlug()+'.zip'; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  FC.toast(ok+'건 ZIP 다운로드 완료');
}
function exportCsv(){
  if(!lastRows.length){ FC.toast('먼저 조회하세요', false); return; }
  var header=['작성일','구분','센터','운수사','차량번호','기종','No','품명','수량','비고','작성자'];
  var rows=[];
  lastRows.forEach(function(r){
    var d=(r.created_at||'').slice(0,10), base=[d, r.category||'', r.center||'', r.operator||'', r.vehicle_no||'', r.model||''];
    var its=Array.isArray(r.items)?r.items:[];
    if(!its.length){ rows.push(base.concat(['','','','', r.created_by||''])); return; }
    its.forEach(function(x,i){ rows.push(base.concat([i+1, x.name||'', x.qty||'', x.note||'', r.created_by||''])); });
  });
  FC.downloadCsv('대폐차지급내역_'+FC.stampSlug()+'.csv', header, rows);
  FC.toast('CSV 다운로드 완료');
}
function openPdf(p){ FC.signedUrl('daepyecha', decodeURIComponent(p), 600).then(function(u){ if(u) window.open(u,'_blank'); else FC.toast('링크 생성 실패',false); }); }
function delRec(id,p){
  if(!FC.isAdmin()){ FC.toast('삭제는 관리자만 가능합니다', false); return; }
  if(!confirm('이 확인서를 삭제할까요? (PDF 포함)')) return;
  FC.removePdf('daepyecha', decodeURIComponent(p)).then(function(){ return FC.restDelete('daepyecha_confirmations','id=eq.'+id); })
  .then(function(){ FC.toast('삭제되었습니다'); runQuery(); }).catch(function(e){ FC.toast('삭제 실패: '+e.message, false); });
}

  el('q-center').innerHTML='<option value="">전체 센터</option>'+FC.CENTERS.map(function(c){return '<option>'+c+'</option>';}).join('');
  el('q-model').innerHTML='<option value="">전체 기종</option>'+FC.FORM_MODELS.map(function(m){return '<option>'+m+'</option>';}).join('');
  el('f-date').value=FC.todayStr();
