<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설치 완료 체크리스트 · ATEC Mobility</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{ --atec-wine:#7A0B3C; --atec-magenta:#C2185B; }
  body{ background:#fdf2f6; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif; }
  .card{ background:#fff; border:1px solid #f3d3e0; border-radius:16px; box-shadow:0 8px 24px -16px rgba(122,11,60,.3); }
  .lbl{ font-size:12px; font-weight:700; color:#7A0B3C; margin-bottom:3px; display:block; }
  .inp{ width:100%; border:1px solid #e7cdd9; border-radius:9px; padding:8px 10px; font-size:14px; background:#fff; }
  .inp:focus{ outline:none; border-color:#C2185B; box-shadow:0 0 0 3px rgba(194,24,91,.12); }
  .btn{ border-radius:10px; font-weight:800; font-size:14px; padding:10px 16px; cursor:pointer; }
  .btn-main{ background:linear-gradient(135deg,#7A0B3C,#C2185B); color:#fff; }
  .btn-out{ background:#fff; border:1.5px solid #C2185B; color:#C2185B; }
  .sig-pad{ border:1px dashed #c98aa8; border-radius:10px; background:#fff; touch-action:none; width:100%; height:120px; }
  .grp-ttl{ font-size:12.5px; font-weight:800; color:#7A0B3C; background:#fbeaf1; border-radius:8px; padding:6px 10px; margin:12px 0 6px; }
  .chk-row{ display:flex; align-items:center; gap:10px; padding:6px 4px; border-bottom:1px solid #f6e3ec; }
  .chk-row .seg{ display:flex; gap:4px; }
  .seg button{ font-size:11px; font-weight:700; border-radius:7px; padding:4px 9px; border:1px solid #e2c7d4; background:#fff; color:#94849b; cursor:pointer; }
  .seg button.ok.on{ background:#15803d; color:#fff; border-color:#15803d; }
  .seg button.na.on{ background:#94a3b8; color:#fff; border-color:#94a3b8; }
  .seg button.no.on{ background:#dc2626; color:#fff; border-color:#dc2626; }
  #print-area{ position:fixed; left:-9999px; top:0; width:780px; background:#fff; padding:34px 38px; color:#1f2733; font-size:13px; }
  #print-area h2{ text-align:center; font-size:22px; font-weight:800; letter-spacing:4px; margin:0 0 4px; }
  #print-area .pa-sub{ text-align:center; color:#666; font-size:12px; margin-bottom:16px; }
  #print-area table{ width:100%; border-collapse:collapse; }
  #print-area .meta td{ border:1px solid #999; padding:7px 9px; font-size:13px; }
  #print-area .meta .k{ background:#f3e6ec; font-weight:700; width:110px; }
  #print-area .ck th, #print-area .ck td{ border:1px solid #999; padding:5px 8px; font-size:12px; }
  #print-area .ck th{ background:#7A0B3C; color:#fff; }
  #print-area .grp td{ background:#f3e6ec; font-weight:700; }
  #print-area .sign-box{ border:1px solid #999; border-radius:6px; padding:10px 12px; margin-top:18px; width:50%; }
  #print-area .sign-img{ height:60px; }
</style>
</head>
<body>
<div class="max-w-3xl mx-auto px-4 py-6">
  <div class="flex items-center justify-between mb-5">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-[#C2185B] text-sm font-bold hover:underline">← 포털</a>
      <h1 class="text-lg font-extrabold text-[#7A0B3C]">설치 완료 체크리스트</h1>
    </div>
    <span id="user-badge" class="text-[11px] text-slate-500"></span>
  </div>

  <div class="card p-5 mb-5">
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-2">
      <div><label class="lbl">작성일</label><input id="f-date" class="inp" type="date"></div>
      <div><label class="lbl">센터</label><select id="f-center" class="inp"></select></div>
      <div><label class="lbl">운수사</label><input id="f-operator" class="inp" placeholder="예) 다모아"></div>
      <div><label class="lbl">차량번호</label><input id="f-vehicle" class="inp" placeholder="예) 서울70사1234"></div>
      <div><label class="lbl">단말기 기종</label><select id="f-model" class="inp" onchange="renderChecklist()"></select></div>
      <div><label class="lbl">단말기 S/N</label><input id="f-sn" class="inp" placeholder="설치 단말기 S/N"></div>
    </div>

    <div id="chk-host"></div>

    <div class="mt-4"><label class="lbl">특이사항 / 메모</label><textarea id="f-memo" class="inp" rows="2"></textarea></div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4 items-end">
      <div>
        <label class="lbl">설치자</label>
        <input id="f-installer" class="inp" placeholder="설치자 이름">
      </div>
      <div class="text-right">
        <span class="lbl inline-block mr-2">종합 판정</span>
        <span id="verdict" class="inline-block px-3 py-1.5 rounded-lg text-[13px] font-extrabold bg-slate-100 text-slate-500">—</span>
      </div>
    </div>
    <div class="mt-3">
      <div class="flex items-center justify-between mb-1">
        <label class="lbl mb-0">설치자 서명</label>
        <button class="text-[11px] text-slate-400 hover:text-[#C2185B]" onclick="SIG.installer.clear()">서명 지우기</button>
      </div>
      <canvas id="sig-installer" class="sig-pad" width="600" height="240"></canvas>
    </div>

    <div class="flex flex-wrap gap-2 mt-5">
      <button class="btn btn-out" onclick="downloadPdf()">PDF 다운로드</button>
      <button class="btn btn-main" id="save-btn" onclick="saveCloud()">체크리스트 저장 (60일 보관)</button>
    </div>
    <p class="text-[11px] text-slate-400 mt-2">저장 시 PDF가 클라우드에 60일간 보관 후 자동 삭제됩니다.</p>
  </div>

  <div class="card p-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-extrabold text-[#7A0B3C]">최근 체크리스트 (최대 60일)</h2>
      <button class="text-[12px] text-[#C2185B] font-bold" onclick="loadList()">새로고침</button>
    </div>
    <div id="list-box" class="text-[13px] text-slate-500">불러오는 중…</div>
  </div>
</div>
<div id="print-area"></div>

<script src="form-common.js"></script>
<script>
var SIG = {};
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

/* 기종별 점검표 (현장에서 수정 가능 · 표준안) */
var BASE = {
  '전원·기본': ['전원 인가 / 전원 LED 정상','입력 전압 정상(24V)','부팅 정상(에러 없이 기동)','펌웨어 최신 버전'],
  '통신': ['센터 통신 연결(온라인)','LTE/모뎀 신호 정상','데이터 송수신 확인'],
  'GPS': ['GPS 위치 수신 정상'],
  '카드·정산': ['교통카드 결제 테스트 정상','PSAM 인식 정상','정산 데이터 전송 확인'],
  '승하차 단말기': ['승차 단말기 통신·결제 정상','하차1 단말기 통신·결제 정상','하차2 단말기 통신·결제 정상','승하차 케이블 체결 상태'],
  '표출·운행': ['표출기 노선·정류장 표출 정상','DTG 운행기록 연동'],
  '설치 마감': ['차량번호/노선 설정 일치','거치·브라켓 고정 상태','케이블 정리·보호 상태']
};
var MODEL_EXTRA = {
  'B700': {},
  'B710': { '승하차 단말기': ['승차 단말기 통신·결제 정상','하차1 단말기 통신·결제 정상','하차2 단말기 통신·결제 정상','승하차 케이블 체결 상태','승하차 위치(승차/하차1/하차2) 설정 확인'] },
  'B800': {}
};

function modelTemplate(model){
  var t = JSON.parse(JSON.stringify(BASE));
  var ex = MODEL_EXTRA[model] || {};
  Object.keys(ex).forEach(function(g){ t[g] = ex[g]; });
  return t;
}

var STATE = {}; // key -> 'ok'|'na'|'no'
function renderChecklist(){
  var model = el('f-model').value;
  var tpl = modelTemplate(model);
  var host = el('chk-host'); host.innerHTML = ''; STATE = {};
  Object.keys(tpl).forEach(function(grp){
    var h = '<div class="grp-ttl">'+esc(grp)+'</div>';
    tpl[grp].forEach(function(item, i){
      var key = grp+'::'+i;
      STATE[key] = 'ok';
      h += '<div class="chk-row" data-key="'+key+'">'+
        '<div class="flex-1 text-[13px] text-slate-700">'+esc(item)+'</div>'+
        '<div class="seg">'+
          '<button class="ok on" onclick="setSeg(this,\''+key+'\',\'ok\')">정상</button>'+
          '<button class="na" onclick="setSeg(this,\''+key+'\',\'na\')">해당없음</button>'+
          '<button class="no" onclick="setSeg(this,\''+key+'\',\'no\')">불량</button>'+
        '</div></div>';
    });
    host.insertAdjacentHTML('beforeend', h);
  });
  updateVerdict();
}
function setSeg(btn, key, val){
  STATE[key] = val;
  var row = btn.closest('.chk-row');
  row.querySelectorAll('.seg button').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  updateVerdict();
}
function updateVerdict(){
  var anyNo = Object.keys(STATE).some(function(k){ return STATE[k]==='no'; });
  var v = el('verdict');
  if(anyNo){ v.textContent='불합격(불량 항목 있음)'; v.className='inline-block px-3 py-1.5 rounded-lg text-[13px] font-extrabold bg-red-100 text-red-700'; }
  else { v.textContent='합격'; v.className='inline-block px-3 py-1.5 rounded-lg text-[13px] font-extrabold bg-green-100 text-green-700'; }
}

function collectItems(){
  var model = el('f-model').value, tpl = modelTemplate(model), out=[];
  Object.keys(tpl).forEach(function(grp){
    tpl[grp].forEach(function(item,i){
      var key = grp+'::'+i;
      out.push({ group:grp, label:item, status:STATE[key]||'ok' });
    });
  });
  return out;
}
function gather(){
  var items = collectItems();
  var pass = !items.some(function(x){ return x.status==='no'; });
  return { date:el('f-date').value, center:el('f-center').value, operator:el('f-operator').value.trim(),
    vehicle:el('f-vehicle').value.trim(), model:el('f-model').value, sn:el('f-sn').value.trim(),
    installer:el('f-installer').value.trim(), memo:el('f-memo').value.trim(), items:items, pass:pass };
}

function statTxt(s){ return s==='ok'?'정상':(s==='na'?'해당없음':'불량'); }
function statColor(s){ return s==='no'?'#dc2626':(s==='na'?'#94a3b8':'#15803d'); }

function buildPrint(d){
  var pa = el('print-area');
  var lastGrp='', rows='';
  d.items.forEach(function(it,i){
    if(it.group!==lastGrp){ rows += '<tr class="grp"><td colspan="3">'+esc(it.group)+'</td></tr>'; lastGrp=it.group; }
    rows += '<tr><td style="text-align:center;width:34px">'+(i+1)+'</td><td>'+esc(it.label)+'</td>'+
            '<td style="text-align:center;width:80px;color:'+statColor(it.status)+';font-weight:700">'+statTxt(it.status)+'</td></tr>';
  });
  var sig = SIG.installer.dataUrl();
  pa.innerHTML =
    '<h2>설치 완료 체크리스트</h2><div class="pa-sub">단말기 설치 점검표 · ATEC Mobility</div>'+
    '<table class="meta"><tr><td class="k">작성일</td><td>'+esc(d.date)+'</td><td class="k">센터</td><td>'+esc(d.center||'-')+'</td></tr>'+
    '<tr><td class="k">운수사</td><td>'+esc(d.operator||'-')+'</td><td class="k">차량번호</td><td>'+esc(d.vehicle||'-')+'</td></tr>'+
    '<tr><td class="k">기종</td><td>'+esc(d.model||'-')+'</td><td class="k">단말기 S/N</td><td>'+esc(d.sn||'-')+'</td></tr></table>'+
    '<div style="height:10px"></div>'+
    '<table class="ck"><thead><tr><th>No</th><th>점검 항목</th><th>판정</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div style="margin-top:12px;font-size:14px;font-weight:800;color:'+(d.pass?'#15803d':'#dc2626')+'">종합 판정 : '+(d.pass?'합격':'불합격(불량 항목 확인 필요)')+'</div>'+
    (d.memo? '<div style="margin-top:8px;font-size:12px"><b>특이사항</b> · '+esc(d.memo)+'</div>':'')+
    '<div class="sign-box"><div style="font-weight:700;font-size:12px;color:#7A0B3C;margin-bottom:4px">설치자</div><div>'+esc(d.installer||'')+'</div>'+(sig?'<img class="sign-img" src="'+sig+'">':'<div class="sign-img"></div>')+'</div>'+
    '<div style="text-align:right;color:#999;font-size:10px;margin-top:12px">발행 '+new Date().toLocaleString('ko-KR')+' · '+esc(FC.myEmail()||'')+'</div>';
  return pa;
}

function validate(d){
  if(!d.center){ FC.toast('센터를 선택하세요', false); return false; }
  if(!d.model){ FC.toast('기종을 선택하세요', false); return false; }
  if(!d.vehicle){ FC.toast('차량번호를 입력하세요', false); return false; }
  return true;
}
function fileName(d){ return (d.vehicle||'차량')+'_설치체크리스트_'+FC.stampSlug()+'.pdf'; }   // 다운로드용(한글 OK)
function storeKey(d){ return (FC.ascii(d.center)||'etc')+'/'+(FC.ascii(d.vehicle)||'veh')+'_'+FC.stampSlug()+'_'+FC.rand4()+'.pdf'; }  // 스토리지(영문/숫자)

function downloadPdf(){
  var d=gather(); if(!validate(d)) return;
  FC.nodeToPdf(buildPrint(d)).then(function(blob){
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fileName(d); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1500); FC.toast('PDF 다운로드 완료');
  }).catch(function(e){ FC.toast('PDF 생성 실패: '+e.message, false); });
}

var saving=false, lastSig='';
function saveCloud(){
  var d=gather(); if(!validate(d)) return;
  if(!FC.cloudAvailable()){ FC.toast('클라우드 미연결 — PDF 다운로드만 가능', false); return; }
  var sig=JSON.stringify(d);
  if(saving||sig===lastSig){ FC.toast('이미 저장되었습니다'); return; }
  saving=true; el('save-btn').disabled=true; el('save-btn').textContent='저장 중…';
  var path=storeKey(d);
  FC.nodeToPdf(buildPrint(d)).then(function(blob){ return FC.uploadPdf('checklist', path, blob); })
  .then(function(){
    return FC.restInsert('install_checklists', {
      center:d.center, operator:d.operator, vehicle_no:d.vehicle, model:d.model, terminal_sn:d.sn,
      items:d.items, pass:d.pass, installer:d.installer, installer_sign:!SIG.installer.isEmpty(),
      pdf_path:path, memo:d.memo, created_by:FC.myEmail()
    });
  }).then(function(){ lastSig=sig; FC.toast('저장되었습니다'); loadList(); })
  .catch(function(e){ FC.toast('저장 실패: '+e.message, false); })
  .then(function(){ saving=false; el('save-btn').disabled=false; el('save-btn').textContent='체크리스트 저장 (60일 보관)'; });
}

function loadList(){
  var box=el('list-box');
  if(!FC.cloudAvailable()){ box.textContent='클라우드 미연결'; return; }
  box.textContent='불러오는 중…';
  FC.restSelect('install_checklists','select=id,center,vehicle_no,model,pass,created_at,pdf_path,created_by&order=created_at.desc&limit=50')
  .then(function(rows){
    if(!rows.length){ box.innerHTML='<span class="text-slate-400">아직 저장된 체크리스트가 없습니다.</span>'; return; }
    box.innerHTML='<div class="divide-y divide-rose-50">'+rows.map(function(r){
      var dt=(r.created_at||'').replace('T',' ').slice(0,16);
      var badge=r.pass?'<span class="text-[10px] bg-green-100 text-green-700 rounded px-1.5 py-0.5 font-bold">합격</span>':'<span class="text-[10px] bg-red-100 text-red-700 rounded px-1.5 py-0.5 font-bold">불합격</span>';
      var del=FC.isAdmin()?'<button onclick="delRec(\''+r.id+'\',\''+enc(r.pdf_path)+'\')" class="text-[11px] text-red-500 hover:underline ml-2">삭제</button>':'';
      return '<div class="flex items-center justify-between py-2"><div><b class="text-[#7A0B3C]">'+esc(r.vehicle_no||'-')+'</b> '+badge+' <span class="text-slate-400">· '+esc(r.center||'')+' · '+esc(r.model||'')+'</span><div class="text-[11px] text-slate-400">'+dt+' · '+esc(r.created_by||'')+'</div></div>'+
        '<div><button onclick="openPdf(\''+enc(r.pdf_path)+'\')" class="text-[12px] text-[#C2185B] font-bold hover:underline">PDF 열기</button>'+del+'</div></div>';
    }).join('')+'</div>';
  }).catch(function(e){ box.textContent='목록 오류: '+e.message; });
}
function enc(s){ return encodeURIComponent(s||''); }
function openPdf(p){ FC.signedUrl('checklist', decodeURIComponent(p), 600).then(function(u){ if(u) window.open(u,'_blank'); else FC.toast('링크 생성 실패',false); }); }
function delRec(id,p){
  if(!FC.isAdmin()){ FC.toast('삭제는 관리자만 가능합니다', false); return; }
  if(!confirm('이 체크리스트를 삭제할까요? (PDF도 함께 삭제)')) return;
  FC.removePdf('checklist', decodeURIComponent(p)).then(function(){ return FC.restDelete('install_checklists','id=eq.'+id); })
  .then(function(){ FC.toast('삭제되었습니다'); loadList(); }).catch(function(e){ FC.toast('삭제 실패: '+e.message, false); });
}

// init
el('f-center').innerHTML='<option value="">선택</option>'+FC.CENTERS.map(function(c){return '<option>'+c+'</option>';}).join('');
el('f-model').innerHTML='<option value="">선택</option>'+FC.MODELS.map(function(m){return '<option>'+m+'</option>';}).join('');
el('f-date').value=FC.todayStr();
el('user-badge').textContent=FC.myEmail()?('작성자 · '+FC.myEmail()):'비로그인';
el('f-model').value='B710'; renderChecklist();
SIG.installer=FC.SignaturePad(el('sig-installer'));
loadList();
</script>
</body>
</html>
