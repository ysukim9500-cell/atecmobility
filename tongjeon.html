<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ATEC Mobility | 통전망 운영관리 시스템</title>
<script>
(function(){
  var de=document.documentElement, mode='';
  try{ mode=sessionStorage.getItem('atec_ui_mode')||''; }catch(e){}
  if(mode==='mobile') de.classList.add('force-mobile');
  if(mode==='web') de.classList.add('force-web');
  /* 모바일 표시는 is-mobile 클래스 하나로 판정 (강제모드 우선, 아니면 뷰포트) */
  var mq=window.matchMedia('(max-width:767px)');
  function sync(){ de.classList.toggle('is-mobile', mode==='mobile' || (mode!=='web' && mq.matches)); }
  sync();
  if(mq.addEventListener) mq.addEventListener('change', sync); else if(mq.addListener) mq.addListener(sync);
})();
</script>
<link rel="stylesheet" href="assets/atec-ci.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
/* ── ATEC CI — 레드 2040C · 그레이 431C · 흰 바탕 · 지정 서체 Noto Sans CJK KR. 옛 토큰 이름은 새 값을 가리킨다 ── */
:root{ --tj-deep:#111111; --tj-main:#D70051; --tj-bright:#D70051; --tj-soft:#F2F2F2; --tj-warn:#8C6D2F;
       --atec-red:#D70051; --atec-gray:#5A666F; --atec-ink:#111111; --atec-line:#D9D9D9; }
*{ font-family:'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif; word-break:keep-all; }
body{ background:#FFFFFF; color:#111111; line-break:strict; -webkit-text-size-adjust:100%; overflow-x:clip; }
img,video,canvas,table{ max-width:100%; }
p,li,td{ text-wrap:pretty; }
.kpi-val,.rtbl td,.tabular{ font-variant-numeric:tabular-nums; }
.no-scrollbar::-webkit-scrollbar{ display:none; }
.no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
@supports (padding:max(0px)){ body{ padding-left:max(0px,env(safe-area-inset-left)); padding-right:max(0px,env(safe-area-inset-right)); } }
.ci-rule{ height:2px; background:var(--atec-red); }
.ci-foot{ border-top:1px solid var(--atec-line); font-size:12px; color:var(--atec-gray); }

/* 카드 */
.panel{ background:#fff; border:1px solid var(--atec-line); border-radius:0; padding:18px 20px 16px; box-shadow:none; position:relative; overflow:hidden; margin-bottom:16px; }
.panel::before{ display:none; }
.panel-head{ display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; color:var(--atec-ink); margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--atec-ink); }
.panel-dot{ width:10px; height:10px; border-radius:0; background:var(--atec-red); display:inline-block; transform:none; }
.panel-sub{ font-size:12px; font-weight:400; color:var(--atec-gray); margin-left:auto; }

/* KPI */
.kpi{ position:relative; background:#fff; border:1px solid var(--atec-line); border-radius:0; padding:18px 22px; overflow:hidden; box-shadow:none; }
.kpi-label{ font-size:13px; font-weight:400; color:var(--atec-gray); }
.kpi-val{ font-size:34px; font-weight:700; letter-spacing:-.01em; line-height:1.1; margin-top:4px; color:var(--atec-ink) !important; }
.kpi-sub{ font-size:12px; color:var(--atec-gray); margin-top:5px; font-weight:400; }

/* 탭: 글자 + 빨간 정사각 (PPT 마스터의 제목 탭) */
#tj-tabs{ background:transparent !important; border:0 !important; border-bottom:1px solid var(--atec-line) !important; border-radius:0 !important; box-shadow:none !important; padding:0 !important; gap:30px !important; width:100% !important; }
.rtab{ padding:14px 0 12px; font-size:14px; font-weight:500; border-radius:0; color:var(--atec-gray); transition:color .12s; display:flex; align-items:center; gap:7px; white-space:nowrap; position:relative; }
.rtab::before{ content:''; width:10px; height:10px; background:transparent; display:inline-block; flex:0 0 auto; }
.rtab.active{ background:transparent; color:var(--atec-ink); font-weight:700; box-shadow:none; }
.rtab.active::before{ background:var(--atec-red); }
.rtab:not(.active):hover{ background:transparent; color:var(--atec-ink); }
.rtab-ico{ width:16px; height:16px; }
.rtab-short{ display:none; }
.rtab-more{ display:none; }

/* 버튼·입력 */
.btn-main{ background:var(--atec-red); color:#fff; font-weight:700; border-radius:0; transition:background .12s; }
.btn-main:hover{ background:#C80850; filter:none; } .btn-main:active{ transform:none; }
.btn-ghost{ border:1px solid #C9CED2; color:var(--atec-ink); font-weight:500; border-radius:0; background:#fff; transition:border-color .12s; }
.btn-ghost:hover{ background:#fff; border-color:var(--atec-ink); }
.btn-warn{ background:#fff; border:1px solid #8C6D2F; color:#8C6D2F; font-weight:500; border-radius:0; }
.fld{ width:100%; font-size:13.5px; border:1px solid #C9CED2; border-radius:0; padding:9px 12px; outline:none; background:#fff; transition:border-color .12s; }
.fld:focus{ border-color:var(--atec-ink); box-shadow:none; }
textarea.fld{ resize:vertical; min-height:62px; line-height:1.5; }
.fld-label{ font-size:12.5px; font-weight:500; color:var(--atec-ink); margin-bottom:5px; display:block; }
.flt-label{ font-size:11px; font-weight:500; color:var(--atec-gray); margin-bottom:3px; display:block; }
.req::after{ content:' *'; color:var(--atec-red); }

/* 폼 섹션 */
.fsec{ grid-column:1 / -1; display:flex; align-items:baseline; gap:8px; margin-top:8px; padding-top:16px; border-top:1px solid var(--atec-line); }
.fsec.first{ margin-top:0; padding-top:0; border-top:none; }
.fsec b{ font-size:13px; font-weight:700; color:var(--atec-ink); }
.fsec b::before{ content:''; display:inline-block; width:8px; height:8px; border-radius:0; background:var(--atec-red); transform:none; margin-right:7px; vertical-align:1px; }
.fsec span{ font-size:11.5px; font-weight:400; color:var(--atec-gray); }

/* 칩 — 상태는 글자색으로 구분 (완료 회색 · 진행중 금색 · 접수 레드 · 보류 연회색) */
.chip{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:500; padding:3px 9px; border-radius:0; }
.chip-done{ background:#F2F2F2; color:#5A666F; }
.chip-prog{ background:#F2F2F2; color:#8C6D2F; }
.chip-new{ background:#F2F2F2; color:#D70051; }
.chip-hold{ background:#F2F2F2; color:#9AA3AA; }
.chip-type{ background:#F2F2F2; color:#5A666F; }
.flt-chip{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:500; padding:3px 6px 3px 10px; border-radius:0; background:#111111; color:#fff; }
.flt-chip button{ width:16px; height:16px; border-radius:0; background:rgba(255,255,255,.25); display:inline-flex; align-items:center; justify-content:center; font-size:10px; line-height:1; }

/* 표 */
.rtbl{ width:100%; border-collapse:collapse; font-size:13px; }
.rtbl th{ text-align:left; font-weight:500; color:var(--atec-gray); font-size:12px; padding:9px 10px; border-bottom:1px solid var(--atec-ink); white-space:nowrap; position:sticky; top:0; background:#fff; z-index:1; }
.rtbl td{ padding:9px 10px; border-bottom:1px solid var(--atec-line); color:var(--atec-ink); vertical-align:top; }
.rtbl tbody tr:hover{ background:#F2F2F2; }

/* 막대 목록 */
#dim-list{ display:none; }                       /* 넓은 화면에서는 차트만 */
.dim-btn{ font-size:12px; font-weight:500; color:var(--atec-gray); padding:5px 11px; border-radius:0 !important; border:1px solid #C9CED2; background:#fff; transition:all .12s; white-space:nowrap; }
.dim-btn.active{ background:#fff; color:var(--atec-ink); border-color:var(--atec-ink); font-weight:700; }
.dim-btn:not(.active):hover{ border-color:var(--atec-ink); color:var(--atec-ink); }
.barrow{ display:flex; align-items:center; gap:10px; padding:5px 0; }
.barrow .rk{ font-size:12px; font-weight:500; color:#9AA3AA; width:18px; text-align:right; }
.barrow .nm{ font-size:12.5px; color:var(--atec-ink); font-weight:500; width:34%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.barrow .bar{ flex:1; height:18px; border-radius:0; background:#F2F2F2; overflow:hidden; }
.barrow .bar>i{ display:block; height:100%; border-radius:0; background:var(--atec-gray); transition:width .5s ease; }
.barrow .vl{ font-size:13px; font-weight:700; color:var(--atec-ink); width:46px; text-align:right; }
.barrow .pc{ font-size:11px; color:var(--atec-gray); width:38px; text-align:right; }

/* 모바일 상세 시트 */
#tj-sheet{ display:none; position:fixed; inset:0; z-index:9999; background:rgba(17,17,17,.5); align-items:flex-end; justify-content:center; }
#tj-sheet.open{ display:flex; }
#tj-sheet .sheet{ background:#fff; width:100%; max-width:520px; border-radius:0; border-top:1px solid var(--atec-line); max-height:86vh; overflow:auto;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom)); box-shadow:none; }
#tj-sheet.open .sheet{ animation:sheetUp .22s ease; }
@keyframes sheetUp{ from{ transform:translateY(16px); opacity:.4; } to{ transform:none; opacity:1; } }
#tj-sheet .grab{ width:38px; height:4px; border-radius:0; background:var(--atec-line); margin:2px auto 12px; }
#tj-sheet .sheet-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
#tj-sheet .sheet-title{ font-weight:700; color:var(--atec-ink); font-size:15.5px; }
#tj-sheet .sheet-close{ width:32px; height:32px; min-height:32px; border:none; background:#F2F2F2; border-radius:0; color:var(--atec-ink); font-size:15px; cursor:pointer; }
#tj-sheet .drow{ display:flex; justify-content:space-between; gap:14px; padding:10px 0; border-bottom:1px solid var(--atec-line); font-size:13.5px; align-items:flex-start; }
#tj-sheet .drow .dl{ color:var(--atec-gray); font-weight:500; font-size:12px; flex:0 0 34%; line-height:1.5; }
#tj-sheet .drow .dv{ text-align:right; color:var(--atec-ink); flex:1; word-break:break-all; line-height:1.5; }
#tj-sheet .sheet-actions{ margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
#tj-sheet .sheet-actions button{ flex:1 1 auto; min-height:44px; font-size:13px; }
.more-item{ display:flex; align-items:center; gap:12px; width:100%; padding:14px 6px; border-bottom:1px solid var(--atec-line); font-size:14.5px; font-weight:500; color:var(--atec-ink); }
.more-item svg{ width:20px; height:20px; color:var(--atec-gray); }

/* 머리글 사용자 영역 */
#tj-user a, #tj-user button{ text-decoration:none !important; border:1px solid var(--atec-line); color:var(--atec-ink); padding:2px 7px; margin-left:4px !important; font-size:11px; }
#tj-user a:hover, #tj-user button:hover{ border-color:var(--atec-ink); }

/* Tailwind 색 유틸리티 → CI (JS 템플릿의 클래스명은 그대로) */
.text-slate-400,.text-slate-500{ color:var(--atec-gray) !important; }
.text-slate-600,.text-slate-700{ color:var(--atec-ink) !important; }
.text-amber-600,.text-amber-700,.text-amber-800{ color:#8C6D2F !important; }
.text-red-600,.text-rose-600{ color:var(--atec-red) !important; }
.bg-slate-50,.bg-slate-100,.bg-amber-50,.bg-teal-50,.bg-emerald-50{ background-color:#F2F2F2 !important; }
.border-slate-200,.border-teal-100,.border-teal-200,.border-amber-200{ border-color:var(--atec-line) !important; }
.rounded,.rounded-md,.rounded-lg,.rounded-xl,.rounded-2xl,.rounded-full{ border-radius:0 !important; }
.shadow-sm,.shadow,.shadow-md,.shadow-lg,.shadow-xl{ box-shadow:none !important; }
#tj-toast{ border-radius:0 !important; box-shadow:none !important; }

html.force-web body{ min-width:1280px; }

/* ============================================================
   모바일 레이어 — html.is-mobile 에만 작성 (단일 소스)
   ============================================================ */
html.is-mobile{ font-size:15px; }
html.is-mobile body{ padding-bottom:88px; }
html.is-mobile .tj-wrap{ padding-left:14px !important; padding-right:14px !important; }
html.is-mobile .desk-only{ display:none !important; }
html.is-mobile button{ min-height:44px; }
html.is-mobile #tj-user button, html.is-mobile .flt-chip button, html.is-mobile .chip button{ min-height:0; }
html.is-mobile input:not([type=checkbox]):not([type=radio]), html.is-mobile select, html.is-mobile textarea{ font-size:16px !important; min-height:44px; }

/* 헤더 */
html.is-mobile header .tj-wrap{ padding-top:12px !important; padding-bottom:12px !important; gap:9px !important; }
html.is-mobile header h1{ font-size:16px !important; line-height:1.3 !important; margin-top:4px !important; }
html.is-mobile header h1 svg{ width:17px !important; height:17px !important; flex:0 0 auto; }
html.is-mobile header span.rounded-full{ font-size:9.5px !important; padding:1px 8px !important; }
html.is-mobile .tj-hdr-sub{ display:none; }
html.is-mobile header .tj-wrap > div:last-child{ width:100%; display:flex; align-items:stretch; gap:8px; }
html.is-mobile #tj-meta{ flex:1 1 auto; font-size:11px !important; line-height:1.5 !important; padding:7px 11px !important; border-radius:0 !important; }
html.is-mobile #tj-user{ flex:0 0 auto; font-size:11px !important; padding:7px 10px !important; border-radius:0 !important; flex-wrap:wrap; row-gap:2px; justify-content:flex-end; max-width:46%; }

/* 카드·간격 */
html.is-mobile .panel{ padding:16px 15px 14px !important; border-radius:0 !important; margin-bottom:12px !important; }
html.is-mobile .panel-head{ font-size:13.5px !important; flex-wrap:wrap; }
html.is-mobile .panel-sub{ flex-basis:100%; margin-left:17px; margin-top:1px; }
html.is-mobile .gap-4{ gap:10px !important; }
html.is-mobile .gap-5{ gap:12px !important; }
html.is-mobile .mb-4,html.is-mobile .mb-5{ margin-bottom:12px !important; }

/* KPI */
html.is-mobile .kpi{ padding:13px 14px !important; border-radius:0 !important; }
html.is-mobile .kpi-label{ font-size:11.5px !important; }
html.is-mobile .kpi-val{ font-size:23px !important; line-height:1.15 !important; margin-top:3px !important; }
html.is-mobile .kpi-sub{ font-size:10.5px !important; margin-top:3px !important; }
html.is-mobile .chip{ font-size:11px !important; padding:3px 9px !important; }
html.is-mobile .h-\[320px\]{ height:230px !important; }
html.is-mobile .h-\[260px\]{ height:200px !important; }

/* 기준 전환 버튼줄 */
/* 기준 버튼 9개 — 옆으로 밀면 마지막 글자가 잘려 보인다. 3칸 격자로 한 번에 보여준다 */
html.is-mobile #tj-dim{ width:100%; display:grid !important; grid-template-columns:repeat(3,1fr); gap:5px; }
html.is-mobile .dim-btn{ width:100%; min-height:36px; padding-left:2px !important; padding-right:2px !important; }
/* 가로 막대 차트는 좁은 화면에서 이름 길이가 제각각이라 줄이 어긋난다 → 순위 목록으로 바꾼다 */
html.is-mobile #dim-chart{ display:none !important; }
html.is-mobile #dim-list{ display:block; }
html.is-mobile .barrow{ gap:8px; padding:6px 0; }
html.is-mobile .barrow .nm{ width:36%; font-size:12px; }
html.is-mobile .barrow .vl{ width:42px; font-size:12.5px; }
html.is-mobile .barrow .pc{ width:32px; }

/* 필터 */
html.is-mobile .flt-toggle{ display:inline-flex !important; align-items:center; gap:5px; font-size:12px; font-weight:700;
  color:var(--tj-main); background:#F2F2F2; border-radius:0; padding:5px 12px; min-height:36px; }
html.is-mobile .flt-grid{ grid-template-columns:1fr 1fr !important; gap:8px !important; }
html.is-mobile .flt-grid.m-collapsed{ display:none !important; }
html.is-mobile .rng-main{ display:grid; grid-template-columns:minmax(0,1fr) 12px minmax(0,1fr) auto; align-items:center; gap:7px; width:100%; }
html.is-mobile .rng-main .rng-label{ grid-column:1 / -1; margin-bottom:-2px; }
html.is-mobile .rng-main input[type=date]{ width:100% !important; min-width:0 !important; padding:8px 6px !important; font-size:13.5px !important; }
html.is-mobile .rng-main .rng-tilde{ text-align:center; }
html.is-mobile .rng-quick{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; width:100%; }
html.is-mobile .rng-quick .btn-ghost{ min-height:40px; padding:6px 4px !important; font-size:12.5px !important; }
html.is-mobile .rng-tail{ width:100%; flex-direction:column; align-items:stretch; gap:7px; }
html.is-mobile .rng-tail .btn-main{ justify-content:center; }

/* 목록: 핵심 4열 + 행 탭 시 상세 */
html.is-mobile .m-list .rtbl th, html.is-mobile .m-list .rtbl td{ display:none; }
html.is-mobile .m-list .rtbl th.m-keep, html.is-mobile .m-list .rtbl td.m-keep{
  display:table-cell; padding:12px 5px; font-size:12.5px; line-height:1.45; vertical-align:middle; white-space:normal; word-break:keep-all; }
html.is-mobile .m-list .rtbl thead th.m-keep{ font-size:11px; color:#9AA3AA; font-weight:700; padding:8px 5px; }
html.is-mobile .m-list .rtbl td[colspan]{ display:table-cell; }
html.is-mobile .m-list tbody tr{ cursor:pointer; }
html.is-mobile .m-list .rtbl td.m-date{ font-size:11.5px; color:#5A666F; white-space:nowrap; }
html.is-mobile .m-list .rtbl td.m-tail, html.is-mobile .m-list .rtbl th.m-tail{ text-align:right; white-space:nowrap; }
html.is-mobile .m-list .rtbl td.m-tail::after{ content:'›'; margin-left:5px; color:#9AA3AA; font-weight:400; font-size:14px; }
html.is-mobile .m-list .panel{ padding:0 !important; }
html.is-mobile .m-list .overflow-x-auto{ max-height:none !important; }

/* 입력 폼 */
html.is-mobile .tj-form .grid{ gap:14px !important; }
html.is-mobile .form-actions{ position:sticky; bottom:88px; z-index:5; background:rgba(255,255,255,.96); 
  margin:14px -15px -14px; padding:10px 15px 12px; border-top:1px solid #D9D9D9; border-radius:0 0 15px 15px; }
html.is-mobile .form-actions .btn-main{ flex:1 1 auto; justify-content:center; }

/* 하단 탭바 — 4칸(현황·장애·자재·더보기) */
html.is-mobile #tj-tabs{ position:fixed; left:0; right:0; bottom:0; top:auto; width:100%; margin:0; z-index:50;
  border-radius:0; border:none; border-top:1px solid #D9D9D9; background:rgba(255,255,255,.97); 
  box-shadow:none; padding:6px 10px calc(6px + env(safe-area-inset-bottom)); gap:4px; }
html.is-mobile .rtab{ flex:1 1 0; min-width:0; flex-direction:column; gap:3px; padding:7px 2px 6px; border-radius:0; position:relative; }
html.is-mobile .rtab-full{ display:none; }
html.is-mobile .rtab-short{ display:inline; font-size:10.5px; font-weight:700; letter-spacing:-.01em; }
html.is-mobile .rtab-ico{ width:21px; height:21px; }
html.is-mobile .rtab:not(.active){ color:#9AA3AA; }
html.is-mobile .rtab:not(.active):hover{ background:transparent; color:#9AA3AA; }
html.is-mobile .rtab.active{ background:transparent; color:var(--tj-main); box-shadow:none; }
html.is-mobile .rtab.active::before{ content:''; position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:22px; height:3px; border-radius:0; background:var(--tj-main); }
html.is-mobile .rtab[data-more]{ display:none; }          /* 수리·장비·터미널은 더보기 안으로 */
html.is-mobile .rtab-more{ display:flex; }
html.is-mobile #tj-toast{ bottom:100px !important; }

/* ── CI 보정: 모바일 탭바·필터 토글·폼 ── */
html.is-mobile .rtab::before{ display:none; }
html.is-mobile .rtab.active{ color:var(--atec-ink); }
html.is-mobile .rtab.active::before{ display:block; content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:10px; height:4px; border-radius:0; background:var(--atec-red); }
html.is-mobile #tj-tabs{ background:#fff; border-top:1px solid var(--atec-line); }
html.is-mobile .flt-toggle{ color:var(--atec-ink); background:#fff; border:1px solid #C9CED2; border-radius:0; }
html.is-mobile .form-actions{ border-radius:0; border-top:1px solid var(--atec-line); background:#fff; }
html.is-mobile #tj-meta{ border:1px solid var(--atec-line) !important; }
html.is-mobile #tj-user{ padding:0 !important; }

<script>
function toggleMobileMenu(on){
  const m=document.getElementById('mobile-menu'); if(!m) return;
  const show = (on===undefined) ? m.classList.contains('hidden') : !!on;
  m.classList.toggle('hidden', !show);
  document.body.classList.toggle('mm-open', show);
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') toggleMobileMenu(false); });
document.addEventListener('click', e=>{ const t=e.target.closest('#mm-links a, #mm-links button'); if(t) setTimeout(()=>toggleMobileMenu(false), 50); });
</script>
